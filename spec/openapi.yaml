  /api/v2/landholdings/:
    get:
      operationId: landholdings_list
      description: |2

        Land holdings (mining claims and other tenures) for the grant's project.

        **Access is controlled by the project owner** via *Project Settings → API Grants →
        Share Land Holdings*, which has three settings:

        * **`off` (default)** — this endpoint returns **403**. The project owner has not
          enabled land-holding sharing for API grants.
        * **`outline`** — returns the fields documented below: boundary geometry, name,
          county, state, claim status and derived acreage.
        * **`detailed`** — returns the outline fields **plus** the claim-maintenance
          detail: `serial_number`, `serial_link`, `date_staked`, `staked_by`,
          `lead_file_name`, `notes`, `county_filed`, `county_filed_date`,
          `county_recording_number`, `blm_filed`, `blm_filed_date`, `land_status`,
          `dropped`, `retain_records`, `current_retain_status`, and attachments.

        A 403 from this endpoint means the data exists but has not been shared with you —
        not that the project has no claims. Ask the project owner to raise the setting.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - landholdings
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLandHoldingOutlineList'
          description: ''
        '403':
          description: The project owner has not enabled land holdings for API grants
            on this project.
