    DrillStructureFeatureTypeRead:
      type: object
      description: |-
        Mixin that flattens extra_data custom fields to top-level serializer fields.

        On READ (to_representation):
            - Extracts keys from extra_data JSON
            - Adds them as top-level fields with 'cf_' prefix
            - Removes the extra_data field from response

        On WRITE (to_internal_value):
            - Collects all 'cf_' prefixed fields from input
            - Validates against CustomFieldSchema
            - Packs them into extra_data for model save
            - Also accepts legacy 'extra_data' dict format for backward compatibility

        Example:
            Input (write):  {"name": "DDH-001", "cf_permit_number": "P-123"}
            Stored:         {"name": "DDH-001", "extra_data": {"permit_number": "P-123"}}
            Output (read):  {"name": "DDH-001", "cf_permit_number": "P-123"}

        Backward Compatibility:
            - QGIS plugin: Ignores extra_data (not in schema), will ignore cf_* until updated
            - Blender plugin: Tolerant of extra fields, continues to work
            - Legacy API: Still accepts nested extra_data dict format
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          description: Short code (e.g. "FT" for Fault). Used by legacy CharField
            + import mapping.
          maxLength: 10
        description:
          type: string
          nullable: true
        color:
          type: string
          maxLength: 7
        display_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: Controls order in logging dropdowns. Lower numbers appear first;
            leave blank to fall back to alphabetical.
        created_by:
          type: string
          readOnly: true
        last_edited_by:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
          default: false
        date_marked_deleted:
          type: string
          format: date
          nullable: true
        extra_data:
          readOnly: true
          nullable: true
          description: Custom field data as key-value pairs. Captures unmapped import
            columns and user-defined custom fields.
      required:
      - code
      - created_by
      - date_created
      - extra_data
      - id
      - last_edited
      - last_edited_by
      - name
      - project
