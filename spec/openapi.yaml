  /api/v2/drill-alterations/{id}/:
    get:
      operationId: drill_alterations_retrieve
      description: |-
        RESTful API endpoint for managing drill alteration data.

        Drill alteration represents geological alteration logging intervals
        within drill holes, including alteration types, textures, and intensities.

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Base URL
        `/api/v1/drill-alterations/`

        ## Key Features
        - Natural key lookups (hole_id + depth_from + alteration + project + company)
        - Automatic depth unit conversion (meters ↔ feet)
        - Flexible image references (IDs or natural keys)
        - Alteration type and texture references
        - Filtering by alteration set (logging session/geologist)
        - Soft delete with restore capability
        - Deletion sync with deleted_ids array in response

        ## Filtering by Alteration Set
        To retrieve alteration data for a specific logging set:
        ```
        GET /api/v1/drill-alterations/?drill_alteration_set=<set_id>
        ```

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access alteration data from projects they have permission to view.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Drill Alteration.
        required: true
      tags:
      - drill-alterations
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
