  /api/v2/drill-lithology-sets/:
    get:
      operationId: drill_lithology_sets_list
      description: |-
        RESTful API endpoint for managing drill lithology logging sets.

        Drill lithology sets represent logging sessions/groups (e.g., "Sally's Logs", "Bob's Logs").
        This allows different geologists to maintain separate lithology logging columns
        that can be viewed independently in third-party applications.

        ## Base URL
        `/api/v1/drill-lithology-sets/`

        ## Key Features
        - Natural key lookups (project + company + name)
        - Listing sets available for a project
        - Tracking lithology entry counts per set
        - Status management (active/archived)
        - Access control (creator can edit/delete)

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access sets from projects they have permission to view.
        Only the creator or admin can edit/delete a set.

        ## Workflow for Third-Party Applications

        1. **List Available Sets for Project**
           ```
           GET /api/v1/drill-lithology-sets/?project=<project_id>
           ```
           Returns all available lithology sets for the project.

        2. **User Selects Set**
           User chooses which set to visualize (e.g., "Sally's Logs").

        3. **Fetch Lithology Data Filtered by Set**
           ```
           GET /api/v1/drill-lithologies/?drill_lithology_set=<set_id>
           ```
           Returns only lithology entries belonging to the selected set.

        4. **User Can Load Multiple Sets**
           Repeat steps 2-3 for additional sets (e.g., "Bob's Logs") to
           compare different logging interpretations side-by-side.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - drill-lithology-sets
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrillLithologySetReadList'
          description: ''
