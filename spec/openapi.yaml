      - assay_merge_settings
      - created_by
      - date_created
      - element
      - element_display
      - id
      - last_edited
      - last_edited_by
      - name
      - project
      - ranges
      - units
    AssayRangeItem:
      type: object
      description: |-
        Serializer for individual assay range items.

        Each range item defines a value range (from_value to to_value) with
        associated visualization properties:
        - color: Hex color for markers/intervals in this range
        - size: Context-dependent sizing value:
            * 2D Maps: Pixels for marker diameter and line width
            * 3D Models: Meters for drill trace cylinder diameter
        - label: Optional human-readable label (e.g., 'High Grade')
        - order: Display ordering for legend/UI
      properties:
        id:
          type: integer
          readOnly: true
        from_value:
          type: number
          format: double
          minimum: -1.0
          description: Start of range (inclusive). Use -1 for below detection limit
            values.
        to_value:
          type: number
          format: double
          minimum: -1.0
          description: End of range (exclusive). Use -1 for below detection limit
            values.
        color:
          type: string
          description: 'Color for this range (hex format: #RRGGBB)'
          maxLength: 7
        size:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Size/width for markers or lines in this range (pixels)
        label:
          type: string
          description: Optional label for this range (e.g., 'Low Grade', 'High Grade')
          maxLength: 50
        order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Display order (lower numbers first)
        created_by:
          type: integer
          readOnly: true
        last_edited_by:
          type: integer
          readOnly: true
          nullable: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
      required:
      - color
      - created_by
      - date_created
      - from_value
      - id
      - last_edited
      - last_edited_by
      - to_value
    AssayRead:
      type: object
      description: |-
        Read-only serializer for Assay list/retrieve operations.

        Returns comprehensive assay data including:
        - ID and natural key
        - Project and Certificate details
        - Sample weight and units
        - Nested elements (AssayUnits) with Method metadata
        - Audit trail

        Filterable by:
        - project (natural key or ID)
        - certificate (natural key or ID)
        - date_created (range)
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        certificate:
          type: string
          readOnly: true
        weight:
          type: number
          format: double
          readOnly: true
          nullable: true
        detection_limit_per_sample:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-sample detection limit reported by the lab when a method
            has variable DL (Method.is_floating_dl=True). For BDL rows the AssayUnit
            stores value=-1 and this field carries the lab's reported '<X.XX' threshold.
        precision_per_sample:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-sample analytical precision (1-sigma error) reported by
            the lab. Drives the strip-log error whisker on the Au track for photon-assay
            samples. NULL for fixed-DL methods that only report a method-level precision.
        analyte_mass_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Actual sample mass loaded by the lab in grams. Distinct from
            the cutsheet's target mass — the lab reports what it really put on the
            instrument. Drives per-sample DL scaling on the photon-assay strip-log
            render.
        lab_status_code:
          allOf:
          - $ref: '#/components/schemas/LabStatusCodeEnum'
          readOnly: true
          description: |-
            Lab QC flag for this sample. BDL = below detection limit; HB / HET = heterogeneity flagged by lab (soft-warn, row imports normally); IS = insufficient sample (AssayUnit lands with value NULL); SNR = sample not received. Empty for samples with no flag.

            * `BDL` - Below Detection Limit
            * `HB` - Heterogeneity bias flagged by lab
            * `HET` - Heterogeneous
            * `IS` - Insufficient sample
            * `SNR` - Sample not received
        elements:
          type: array
          items:
            $ref: '#/components/schemas/AssayUnitNested'
          readOnly: true
        natural_key:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        qaqc_status:
          type: string
          readOnly: true
      required:
      - analyte_mass_g
      - certificate
      - created_by
      - date_created
      - detection_limit_per_sample
      - elements
      - id
      - lab_status_code
      - name
      - natural_key
      - precision_per_sample
      - project
      - qaqc_status
      - weight
