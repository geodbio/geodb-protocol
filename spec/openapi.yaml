        ### Project Configuration
        - Define custom metadata fields for drill collars (permit numbers, property owners)
        - Add project-specific sample tracking fields
        - Create custom categorization fields with choice lists

        ### Data Import
        - Schema fields are automatically matched during CSV/Excel import
        - Unmapped columns are captured in extra_data with schema-defined types
        - Choice fields are validated against defined options

        ### Data Export
        - Custom fields appear as separate columns in exports
        - Column headers use display_name from schema definitions

