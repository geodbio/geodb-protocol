        purge_volume:
          type: number
          format: double
          nullable: true
          description: Volume purged before sampling (wells, liters or gallons)
        water_appearance:
          type: string
          nullable: true
          description: Visual description (clear, turbid, colored, odorous, etc.)
          maxLength: 200
        weather_conditions:
          type: string
          nullable: true
