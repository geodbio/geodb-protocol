    StandardUnitNested:
      type: object
      description: |-
        Nested serializer for StandardUnit elements.

        Used within StandardReadSerializer/StandardWriteSerializer to handle
        the elements array (certified values for each (analyte, method) pair).

        Includes OREAS DataPack statistical fields for QAQC charting:
        - Standard deviation bounds (1SD, 2SD, 3SD)
        - Relative standard deviation (RSD%)
        - Tolerance windows (5%, 95%)
        - Confidence intervals (95%)
        - AnalyticalMethod FK + denormalised digestion/finish FKs
        - analyte_type / value_flag / detection_limit for oxide, sub-detection,
          indeterminate sentinels.
      properties:
        element:
          type: string
          maxLength: 20
        analyte_type:
          allOf:
          - $ref: '#/components/schemas/AnalyteTypeEnum'
          default: element
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        value_flag:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ValueFlagEnum'
          - $ref: '#/components/schemas/BlankEnum'
        detection_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        units:
          type: string
          maxLength: 16
        order:
          type: integer
          default: 0
        std_dev_1sd:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        std_dev_2sd_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        std_dev_2sd_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        std_dev_3sd_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        std_dev_3sd_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        rsd_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,4})?$
          nullable: true
        tolerance_5pct_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        tolerance_5pct_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        confidence_95_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        confidence_95_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        tolerance_95_low:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        tolerance_95_high:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
        method:
          type: integer
          nullable: true
        method_display:
          type: string
          readOnly: true
        digestion:
          type: integer
          nullable: true
        digestion_display:
          type: string
          readOnly: true
        finish:
