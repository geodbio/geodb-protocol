            - retrieve: GET /api/v1/standards/{id}/ - Get single standard with nested elements
            - create: POST /api/v1/standards/ - Create new standard with elements
            - update: PUT /api/v1/standards/{id}/ - Full update (syncs elements)
            - partial_update: PATCH /api/v1/standards/{id}/ - Partial update
            - destroy: DELETE /api/v1/standards/{id}/ - Soft delete
            - restore: POST /api/v1/standards/{id}/restore/ - Restore soft-deleted standard

        Filters:
            - ?company_id={id} - Filter by company (defaults to user's company)
            - ?supplier={name} - Filter by supplier name (partial match)

        Nested Elements:
            - Create: Include 'elements' array in request body
            - Update: Include 'elements' array to sync (add/update/delete)
            - Elements are StandardUnit records (element, value, units)

        Permissions:
            - User must be authenticated
            - User can only access standards from their company
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
