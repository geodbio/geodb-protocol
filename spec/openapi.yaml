  /api/v2/drill-pads/:
    get:
      operationId: drill_pads_list
      description: |-
        RESTful API endpoint for managing drill pad data.

        A drill pad represents a physical location where multiple drill holes may be
        collared. Useful for drill program planning, permitting, and environmental tracking.

        ## Upsert Support

        This viewset supports natural key upsert operations. POST requests will automatically
        create or update records based on the natural key (name + project).

        POST /api/v1/drill-pads/
        {"name": "Pad 1", "project": {"name": "...", "company": "..."}, ...}
        -> Creates if not exists, updates if exists

        POST /api/v1/drill-pads/bulk/
        [{...}, {...}]
        -> Bulk upsert with summary response

        ## Base URL

        `/api/v1/drill-pads/`

        ## Endpoints

        ### List Drill Pads
        `GET /api/v1/drill-pads/`

        Returns a list of all drill pads the authenticated user has access to.

        **Query Parameters:**
        - `project_id` (optional): Filter by specific project ID
        - `status` (optional): Filter by status (planned, built, historic)

        **Example:**
        ```bash
        curl -H "Authorization: Token YOUR_TOKEN" \
             "https://api.example.com/api/v1/drill-pads/?project_id=123&status=built"
        ```

        **Response:**
        ```json
        {
            "count": 2,
            "next": null,
            "previous": null,
            "results": [
                {
                    "id": 1,
                    "name": "Pad 1",
                    "project": {
                        "name": "Gold Mountain",
                        "company": "ACME Mining"
                    },
                    "status": "built",
                    "status_display": "Built",
                    "location": {
                        "type": "Point",
                        "coordinates": [-122.6765, 45.5231]
                    },
                    "permit_number": "DRILL-2024-001",
                    "constructed_date": "2024-01-15",
                    "hole_count": 5,
                    "total_meters_drilled": 2500.0
                }
            ]
        }
        ```

        ### Retrieve Single Drill Pad
        `GET /api/v1/drill-pads/{id}/`

        Returns detailed information about a specific drill pad.

        ### Create Drill Pad
        `POST /api/v1/drill-pads/`

        Creates a new drill pad.

        **Required Fields:**
        - `name`: Pad identifier (string, max 100 chars)
        - `project`: Project natural key (object with "name" and "company")

        **Optional Fields:**
        - `status`: Status (planned, built, historic) - defaults to "planned"
        - `latitude`, `longitude`: Coordinates for pad centroid
        - `permit_number`: Drilling permit number
        - `constructed_date`: Date pad was constructed (YYYY-MM-DD)
        - `reclaimed_date`: Date pad was reclaimed (YYYY-MM-DD)
        - `access_type`: Access method (road, helicopter, etc.)
        - `disturbance_area`: Disturbed area in square meters
        - `notes`: General notes
        - `environmental_notes`: Environmental considerations

        **Example Request:**
        ```bash
        curl -X POST \
             -H "Authorization: Token YOUR_TOKEN" \
             -H "Content-Type: application/json" \
             -d '{
                 "name": "Pad 1",
                 "project": {
                     "name": "Gold Mountain",
                     "company": "ACME Mining"
                 },
                 "status": "planned",
                 "latitude": 45.5231,
                 "longitude": -122.6765,
                 "permit_number": "DRILL-2024-001",
                 "access_type": "road",
                 "notes": "Main drill site"
             }' \
             "https://api.example.com/api/v1/drill-pads/"
        ```

        ### Update Drill Pad
        `PUT /api/v1/drill-pads/{id}/` - Full update (all fields required)
        `PATCH /api/v1/drill-pads/{id}/` - Partial update (only provided fields updated)

        ### Delete Drill Pad
        `DELETE /api/v1/drill-pads/{id}/`

        Performs a soft delete (marks as deleted but doesn't remove from database).

        ### Restore Drill Pad
        `POST /api/v1/drill-pads/{id}/restore/`

        Restores a previously soft-deleted drill pad.

        ## Authentication

        All endpoints require authentication via Knox token.

        ## Permissions

        Users can only access drill pads from projects they have permission to view.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - drill-pads
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrillPadReadList'
          description: ''
