    DrillPadRead:
      type: object
      description: |-
        Serializer for reading DrillPad data (GET operations).

        Returns comprehensive data with natural keys for all foreign keys.

        **IMPORTANT FOR PLUGINS:** All responses include `coordinate_system_metadata` field
        with origin coordinates, CRS, and timestamp. Plugins MUST store this metadata
        and send it back when importing edited data.

        ## Fields

        - `id`: Database ID (read-only)
        - `name`: Pad name/identifier
        - `natural_key`: Tuple (name, project, company) for plugin synchronization
        - `project`: Natural key object {"name": "...", "company": "..."}
        - `status`: Status (planned, built, historic)
        - `status_display`: Human-readable status
        - `location`: GeoJSON Point for pad centroid
        - `polygon`: GeoJSON Polygon for pad boundary (optional)
        - `geometry`: EWKT format of polygon (for QGIS plugin compatibility)
        - `permit_number`: Drilling permit number
        - `constructed_date`: Date pad was constructed
        - `reclaimed_date`: Date pad was reclaimed
        - `access_type`: Access method (road, helicopter, etc.)
        - `disturbance_area`: Disturbed area in square meters
        - `hole_count`: Number of drill holes on this pad (computed)
        - `total_meters_drilled`: Total meters drilled from this pad (computed)
        - `notes`: General notes
        - `environmental_notes`: Environmental considerations
        - `created_by`: User who created the pad
        - `date_created`: Creation timestamp
        - `last_edited_by`: User who last edited the pad
        - `last_edited`: Last edit timestamp
        - `mark_deleted`: Soft delete flag
        - `coordinate_system_metadata`: CRS metadata for plugin sync (from CoordinateSystemMixin)

        ## Response Example

        ```json
        {
            "id": 1,
            "name": "Pad 1",
            "natural_key": ["Pad 1", "Gold Mountain", "ACME Mining"],
            "project": {
                "name": "Gold Mountain",
                "company": "ACME Mining"
            },
            "status": "built",
            "status_display": "Built",
            "location": {
                "type": "Point",
                "coordinates": [-122.6765, 45.5231]
            },
            "polygon": null,
            "permit_number": "DRILL-2024-001",
            "constructed_date": "2024-01-15",
            "reclaimed_date": null,
            "access_type": "road",
            "disturbance_area": 1500.0,
            "hole_count": 5,
            "total_meters_drilled": 2500.0,
            "notes": "Main drill site",
            "environmental_notes": "Avoid creek buffer",
            "created_by": "user@example.com",
            "date_created": "2024-01-10T09:00:00Z",
            "last_edited_by": "user@example.com",
            "last_edited": "2024-01-15",
            "mark_deleted": false,
            "coordinate_system_metadata": {
                "origin_x": -115.5678,
                "origin_y": 49.1234,
                "crs_epsg": 4326,
                "updated_at": "2025-01-15T10:30:00Z"
            }
        }
        ```
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Pad name or identifier (e.g., 'Pad 1', 'Main Drill Site')
          maxLength: 100
        natural_key:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DrillPadReadStatusEnum'
          description: |-
            Current status of the pad

            * `planned` - Planned
            * `built` - Built
            * `historic` - Historic
        status_display:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        polygon:
          type: string
          readOnly: true
        geometry:
          type: string
          readOnly: true
        elevation:
          type: string
          readOnly: true
        permit_number:
          type: string
          nullable: true
          description: Drilling permit number
          maxLength: 50
        constructed_date:
          type: string
          format: date
          nullable: true
          description: Date pad was constructed
        reclaimed_date:
          type: string
          format: date
          nullable: true
          description: Date pad was reclaimed/restored
        access_type:
          type: string
          nullable: true
          description: Access method (road, helicopter, etc.)
          maxLength: 50
        disturbance_area:
          type: number
          format: double
          nullable: true
          description: Disturbed area in square meters
        hole_count:
          type: string
          readOnly: true
        total_meters_drilled:
          type: string
          readOnly: true
        notes:
          type: string
          nullable: true
          description: General notes about the pad
        environmental_notes:
          type: string
          nullable: true
          description: Environmental considerations or restrictions
        created_by:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited_by:
          type: string
          readOnly: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
          default: false
      required:
      - created_by
      - date_created
      - elevation
      - geometry
      - hole_count
      - id
      - last_edited
      - last_edited_by
      - location
      - name
      - natural_key
      - polygon
      - project
      - status_display
      - total_meters_drilled
