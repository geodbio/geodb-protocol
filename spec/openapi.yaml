  /api/v2/drill-rqd-sets/:
    get:
      operationId: drill_rqd_sets_list
      description: |-
        RESTful API endpoint for managing drill RQD logging sets.

        Drill RQD sets represent logging sessions/groups (e.g., "Sally's Logs", "Bob's Logs").
        This allows different geologists to maintain separate RQD logging columns
        that can be viewed independently in third-party applications.

        ## Base URL
        `/api/v1/drill-rqd-sets/`

        ## Key Features
        - Natural key lookups (project + company + name)
        - Listing sets available for a project
        - Tracking RQD entry counts per set
        - Status management (active/archived)
        - Access control (creator can edit/delete)

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access sets from projects they have permission to view.
        Only the creator or admin can edit/delete a set.

        ## Workflow for Third-Party Applications

        1. **List Available Sets for Project**
           ```
           GET /api/v1/drill-rqd-sets/?project=<project_id>
           ```
           Returns all available RQD sets for the project.

        2. **User Selects Set**
           User chooses which set to visualize (e.g., "Sally's Logs").

        3. **Fetch RQD Data Filtered by Set**
           ```
           GET /api/v1/drill-rqds/?drill_rqd_set=<set_id>
           ```
           Returns only RQD entries belonging to the selected set.

        4. **User Can Load Multiple Sets**
           Repeat steps 2-3 for additional sets (e.g., "Bob's Logs") to
           compare different logging interpretations side-by-side.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - drill-rqd-sets
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrillRQDSetReadList'
          description: ''
