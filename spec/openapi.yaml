  /api/v2/projects/{project_code}/elevation/:
    get:
      operationId: projects_elevation_list
      description: |-
        ViewSet for accessing elevation data with terrain meshes and imagery.

        ## Base Endpoints (DRF Token Auth)
        - GET /api/projects/{project_code}/elevation/ - List all elevation data
        - GET /api/projects/{project_code}/elevation/{id}/ - Get specific elevation data
        - POST /api/projects/{project_code}/elevation/acquire/ - Trigger DEM acquisition
        - GET /api/projects/{project_code}/elevation/latest/ - Get latest elevation data

        ## Terrain Mesh & Imagery Endpoints (Session Auth)
        Note: Terrain mesh and imagery management endpoints use Django session auth
        and are located at /geodata/api/ (not /api/v1/):

        - GET /geodata/api/projects/{code}/elevation/{id}/meshes/ - List terrain meshes
        - POST /geodata/api/projects/{code}/elevation/{id}/meshes/{resolution}/regenerate/ - Regenerate mesh
        - DELETE /geodata/api/projects/{code}/elevation/{id}/meshes/{resolution}/ - Delete mesh
        - GET /geodata/api/projects/{code}/elevation/{id}/meshes/{resolution}/export/?format=obj - Export mesh

        - GET /geodata/api/projects/{code}/elevation/{id}/imagery/ - List terrain imagery
        - POST /geodata/api/projects/{code}/elevation/{id}/imagery/generate/ - Generate imagery
        - DELETE /geodata/api/projects/{code}/elevation/{id}/imagery/{type}/ - Delete imagery (type: satellite|topo)

        ## Response Fields (v1.3)
        Each elevation data object now includes:
        - `terrain_meshes`: Dict with CDN URLs for 'very_low', 'low', 'medium' resolution meshes
        - `satellite_imagery_url`: CDN URL for RGB satellite texture (JPEG)
        - `topo_imagery_url`: CDN URL for USGS topo map texture (JPEG)

        These URLs point directly to Digital Ocean Spaces CDN, allowing clients to
        download and visualize terrain without Django server involvement.

        ## Example Response
        ```json
        {
          "id": 123,
          "project": 456,
          "data_source": "USGS_3DEP_30M",
          "geotiff_url": "https://cdn.geodb.io/...",
          "terrain_meshes": {
            "very_low": "https://cdn.geodb.io/terrain_meshes/456/123_very_low.json",
            "low": "https://cdn.geodb.io/terrain_meshes/456/123_low.json",
            "medium": "https://cdn.geodb.io/terrain_meshes/456/123_medium.json"
          },
          "satellite_imagery_url": "https://cdn.geodb.io/terrain_meshes/project_456_elevation_123_satellite.jpg",
          "topo_imagery_url": "https://cdn.geodb.io/terrain_meshes/project_456_elevation_123_topo.jpg",
          ...
        }
        ```
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: project_code
        schema:
          type: string
        required: true
      tags:
      - projects
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElevationDataList'
          description: ''
