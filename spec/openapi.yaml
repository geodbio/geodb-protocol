  /api/v2/drill-vein-sets/:
    get:
      operationId: drill_vein_sets_list
      description: |-
        RESTful API endpoint for managing drill vein logging sets.

        Drill vein sets represent logging sessions/groups (e.g., "Sally's Logs", "Bob's Logs").
        This allows different geologists to maintain separate vein logging columns
        that can be viewed independently in third-party applications.

        ## Base URL
        `/api/v1/drill-vein-sets/`

        ## Key Features
        - Natural key lookups (project + company + name)
        - Listing sets available for a project
        - Tracking vein entry counts per set
        - Status management (active/archived)
        - Access control (creator can edit/delete)

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access sets from projects they have permission to view.
        Only the creator or admin can edit/delete a set.

        ## Workflow for Third-Party Applications

        1. **List Available Sets for Project**
           ```
           GET /api/v1/drill-vein-sets/?project=<project_id>
           ```
           Returns all available vein sets for the project.

        2. **User Selects Set**
           User chooses which set to visualize (e.g., "Sally's Logs").

        3. **Fetch Vein Data Filtered by Set**
           ```
           GET /api/v1/drill-veins/?vein_set=<set_id>
           ```
           Returns only vein entries belonging to the selected set.

        4. **User Can Load Multiple Sets**
           Repeat steps 2-3 for additional sets (e.g., "Bob's Logs") to
           compare different logging interpretations side-by-side.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - drill-vein-sets
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDrillVeinSetReadList'
          description: ''
