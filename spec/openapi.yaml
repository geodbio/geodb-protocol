  /api/v2/drill-veins/{id}/:
    get:
      operationId: drill_veins_retrieve
      description: |-
        RESTful API endpoint for managing drill vein data.

        Drill veins represent vein logging intervals within drill holes,
        including vein type, width measurements, fill minerals, and
        selvage alteration characteristics.

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Base URL
        `/api/v1/drill-veins/`

        ## Key Features
        - Natural key lookups (hole_id + depth_from + project + company)
        - Automatic depth unit conversion (meters ↔ feet)
        - Flexible image references (IDs or natural keys)
        - Fill minerals with percentages (ManyToMany through VeinMineralContent)
        - Vein type classification
        - Selvage alteration tracking
        - Soft delete with restore capability
        - Deletion sync with deleted_ids array in response

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access vein data from projects they have permission to view.
      parameters:
