  /api/v2/assay-merge-settings/{id}/get_merge_config/:
    get:
      operationId: assay_merge_settings_get_merge_config_retrieve
      description: |-
        Get the effective merge configuration for a specific element.

        GET /api/v1/assay-merge-settings/{id}/get_merge_config/?element=Au

        Returns the merge strategy, units, and method filter for the specified element,
        taking into account per-element overrides.

        Response:
        {
          "element": "Au",
          "merge_strategy": "high",
          "target_units": "g/t",
          "method_type_filter": "FA",
          "convert_bdl": true,
          "bdl_multiplier": 0.5
