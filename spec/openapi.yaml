            Source of elevation data

            * `USGS_3DEP_1M` - USGS 3DEP 1m (USA Only, Highest Detail)
            * `USGS_3DEP_10M` - USGS 3DEP 10m (USA Only)
            * `USGS_3DEP_30M` - USGS 3DEP 30m (USA Only)
            * `OPENTOPO_USGS1M` - OpenTopography: USGS 1m (USA Only, Best Quality)
            * `OPENTOPO_USGS10M` - OpenTopography: USGS 10m (USA Only)
            * `OPENTOPO_USGS30M` - OpenTopography: USGS 30m (USA Only)
            * `OPENTOPO_COP30` - OpenTopography: Copernicus 30m (Global)
            * `OPENTOPO_SRTMGL1` - OpenTopography: SRTM 30m (±60° latitude)
            * `OPENTOPO_AW3D30` - OpenTopography: ALOS World 3D 30m (Global)
            * `MANUAL_UPLOAD` - Manually Uploaded
