    DrillCollarRead:
      type: object
      description: |-
        Serializer for reading DrillCollar data (GET operations).

        Returns comprehensive data with natural keys for all foreign keys and
        rich representations for documents and images (including both IDs and natural keys).

        **IMPORTANT FOR PLUGINS:** All responses include `coordinate_system_metadata` field
        with origin coordinates, CRS, and timestamp. Plugins MUST store this metadata
        and send it back when importing edited data.

        ## Fields

        ### Basic Fields
        - `id`: Database ID (read-only)
        - `name`: Drill hole identifier
        - `project`: Natural key object {"name": "...", "company": "..."}
        - `total_depth`: Total depth of drill hole
        - `azimuth`: Azimuth angle (0-360 degrees)
        - `dip`: Dip angle (-90 to 90 degrees)
        - `hole_type`: Type code (e.g., 'DD', 'RC', 'RAB')
        - `hole_status`: Status code (e.g., 'COM', 'ABN', 'PLN')
        - `hole_size`: Hole diameter
        - `date_completed`: Completion date
        - `length_units`: 'M' (meters) or 'FT' (feet)
        - `notes`: Additional notes
        - `geometry`: Auto-calculated Point geometry (read-only)
        - `documents`: Rich document representations with IDs and natural keys
        - `images`: Rich image representations with IDs, URLs, and natural keys

        ### Multi-Format Coordinates (Phase 2B - Zero Data Loss)

        Multi-format coordinate fields are automatically provided by MultiFormatCoordinatesMixin.

        **Original Input (exact user input, never modified):**
        - `latitude`: Original Y coordinate (northing or latitude) - model field
        - `longitude`: Original X coordinate (easting or longitude) - model field
        - `elevation`: Original elevation - model field
        - `epsg`: Original EPSG/SRID code - model field
        - `xy_units`: 'degrees', 'meters', 'feet', 'us-feet' - computed from EPSG
        - `elevation_units`: 'M' or 'FT' (from length_units field) - model field

        **Project CRS (transformed to project's standard EPSG):**
        - `crs_easting`: X coordinate in project CRS - computed
        - `crs_northing`: Y coordinate in project CRS - computed
        - `crs_elevation`: Z coordinate in project CRS - computed
        - `crs_epsg`: Project's EPSG code (e.g., 26910, 32611, 4326) - computed
        - `crs_xy_units`: 'degrees', 'meters', 'feet', 'us-feet' - computed
        - `crs_elevation_units`: 'M' or 'FT' - computed

        **Proj4 Local Grid (custom transformation for Blender/mining software):**
        - `proj4_easting`: X coordinate in local grid (cm precision) - computed
        - `proj4_northing`: Y coordinate in local grid (cm precision) - computed
        - `proj4_elevation`: Z coordinate in local grid (cm precision) - computed
        - `proj4_string`: Project's Proj4 definition string - computed
        - `proj4_xy_units`: Usually 'meters' - computed
        - `proj4_elevation_units`: 'M' or 'FT' - computed

        ## Response Example

        ```json
        {
            "id": 1,
            "name": "DDH-001",
            "project": {
                "name": "Gold Mountain",
                "company": "ACME Mining"
            },

            // Original input coordinates (Zero Data Loss - exact user input)
            "latitude": 5000000.0,
            "longitude": 500000.0,
            "elevation": 1500.0,
            "epsg": 26910,
            "xy_units": "meters",
            "length_units": "M",

            // Project CRS coordinates (transformed to project EPSG)
            "crs_easting": 500000.0,
            "crs_northing": 5000000.0,
            "crs_elevation": 1500.0,
            "crs_epsg": 26910,
            "crs_xy_units": "meters",
            "crs_elevation_units": "M",

            // Proj4 local grid coordinates (custom transformation)
            "proj4_easting": 1234.56,
            "proj4_northing": 2345.67,
            "proj4_elevation": 1500.0,
            "proj4_string": "+proj=tmerc +lat_0=49.0 +lon_0=-115.5 ...",
            "proj4_xy_units": "meters",
            "proj4_elevation_units": "M",

            "total_depth": 250.0,
            "azimuth": 0,
            "dip": -90,
            "hole_type": "DD",
            "hole_status": "COM",

            "images": [
                {
                    "id": 123,
                    "url": "https://...",
                    "thumbnail_url": "https://...",
                    "original_filename": "DDH001_core.jpg",
                    "category": "CORE",
                    "natural_key": {
                        "original_filename": "DDH001_core.jpg",
                        "project": {"name": "Gold Mountain", "company": "ACME Mining"}
                    }
                }
            ],
            "documents": [
                {
                    "id": 456,
                    "url": "https://...",
                    "file_name": "drill_log_DDH001.pdf",
                    "title": "Drill Log",
                    "natural_key": {
                        "file_name": "drill_log_DDH001.pdf",
                        "project": {"name": "Gold Mountain", "company": "ACME Mining"}
                    }
                }
            ],

            "coordinate_system_metadata": {
                "origin_x": -115.5678,
                "origin_y": 49.1234,
                "crs_epsg": 4326,
                "updated_at": "2025-01-15T10:30:00Z"
            }
        }
        ```
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        project:
          type: string
          readOnly: true
