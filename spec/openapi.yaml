openapi: 3.0.3
info:
  title: geoDB Exploration Data API
  version: 2.0.0
  description: 'Read-only REST access to a geoDB project''s exploration data — drill
    collars, samples, surveys, assays, point samples, project files and model schemas.
    Vendors authenticate with a project-pinned, read-only access grant:  `Authorization:
    Grant <token>`  (minted by the project owner under Project Settings → API Access
    Grants). Existing clients (mobile, QGIS, Blender) continue to use Knox token auth:
    `Authorization: Token <token>`.'
paths:
  /api/v2/alterations/:
    get:
      operationId: alterations_list
      description: |-
        List alterations for a project.

        REQUIRED: The 'project_id' query parameter must be provided.
        Returns 400 Bad Request if missing.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - alterations
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlterationReadList'
          description: ''
  /api/v2/alterations/{id}/:
    get:
      operationId: alterations_retrieve
      description: |-
        RESTful API endpoint for managing alteration lookup data.

        Alteration represents alteration type classifications used in drill logging.
        Each alteration type has a name, description, and color for visualization.

        ## Base URL
        `/api/v1/alterations/`

        ## Key Features
        - Natural key lookups (name + project + company)
        - Color field for visualization in 3D viewers and logs
        - Project-specific alteration types
        - Full CRUD operations
        - Filterable by project

        ## Use Cases
        1. **Modal Configuration**: Fetch all alteration types for a project to populate selection UI
        2. **Color Mapping**: Get color codes for rendering drill logs
        3. **Data Entry**: Create/update alteration types for a project

        ## Filtering (REQUIRED)
        The `project` parameter is **required** to retrieve alterations:
        ```
        GET /api/v1/alterations/?project=<project_id>
        ```

        Returns 400 Bad Request if project parameter is not provided.

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access alteration data from projects they have permission to view.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Alteration.
        required: true
      tags:
      - alterations
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlterationRead'
          description: ''
  /api/v2/assay-merge-settings/:
    get:
      operationId: assay_merge_settings_list
      description: |-
        RESTful API endpoint for managing assay merge settings.

        Assay merge settings control how geochemical assay data is processed when:
        - Multiple assay methods exist for the same sample
        - Unit conversions are needed (ppm → pct, g/t → oz/t)
        - Below-detection-limit (BDL) values need handling
        - Samples need to be merged to a common interval

        ## Base URL
        `/api/v1/assay-merge-settings/`

        ## Key Features
        - Define merge strategies (highest, lowest, average)
        - Configure unit conversions per element
        - Handle below-detection-limit values
        - Per-element configuration overrides
        - Filter by analytical method type (FA, AR, ICP)
        - Protected default settings
        - Copy settings between projects

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access merge settings from projects they have permission to view.

        ## Use Cases

        ### Multi-Method Assays
        When samples have been analyzed by multiple methods:
        - Fire Assay (FA) for gold
        - Aqua Regia (AR) for base metals
        - ICP-MS for trace elements

        You can configure which method to prefer:
        - Use FA results for Au (highest values)
        - Use ICP-MS for multi-element suites
        - Average duplicate analyses

        ### Unit Standardization
        Convert all assays to consistent units:
        - Gold: g/t (grams per tonne)
        - Copper: pct (percent)
        - Silver: ppm (parts per million)
        - Rare earths: ppm

        ### Below-Detection-Limit Handling
        Options for BDL values:
        - Convert to numeric (0.5 × detection limit)
        - Leave as-is for statistical analysis
        - Custom multiplier per element

        ### Interval Compositing
        Merge samples to standard intervals:
        - Aggregate 1m samples to 2m composites
        - Merge multi-stage analyses
        - Handle overlapping intervals

        ## Configuration Structure

        ### Default Settings
        - `default_strategy`: "high" | "low" | "average"
        - `default_units`: "ppm" | "pct" | "ppb" | "opt"
        - `convert_bdl`: Boolean flag - whether to convert BDL values
        - `bdl_multiplier`: 0.0 to 1.0 (typically 0.5) - fraction of detection limit for BDL values

        ### Per-Element Overrides
        ```json
        {
          "element_overrides": [
            {
              "element": "Au",
              "target_units": "g/t",
              "merge_strategy": "high",
              "method_type_filter": "FA"
            },
            {
              "element": "Cu",
              "target_units": "pct",
              "merge_strategy": "average"
            }
          ]
        }
        ```

        ## Query Parameters

        - `project_id` - Filter to specific project (integer ID)
        - `name` - Filter by name (case-insensitive partial match)

        ## Custom Actions

        - `POST /api/v1/assay-merge-settings/{id}/restore/` - Restore soft-deleted settings
        - `POST /api/v1/assay-merge-settings/{id}/copy_to_project/` - Copy settings to another project
        - `GET /api/v1/assay-merge-settings/{id}/get_merge_config/` - Get effective merge config for element

        ## Protected Settings

        The "Default Merge Settings" record is protected:
        - Cannot be deleted
        - Cannot be renamed
        - Provides fallback configuration for all projects

        ## Example Usage

        ### Create New Merge Settings
        ```json
        POST /api/v1/assay-merge-settings/
        {
          "name": "Gold Project - Standard",
          "project": 123,
          "default_strategy": "high",
          "default_units": "g/t",
          "convert_bdl": true,
          "bdl_multiplier": 0.5,
          "element_overrides": [
            {
              "element": "Au",
              "target_units": "g/t",
              "merge_strategy": "high",
              "method_type_filter": "FA"
            },
            {
              "element": "Cu",
              "target_units": "pct",
              "merge_strategy": "average"
            }
          ]
        }
        ```

        ### List Settings for Project
        ```
        GET /api/v1/assay-merge-settings/?project_id=123
        ```

        ### Get Merge Config for Element
        ```
        GET /api/v1/assay-merge-settings/456/get_merge_config/?element=Au
        ```

        ## Integration with Range Configurations

        AssayRangeConfiguration can optionally link to AssayMergeSettings:
        - Ensures consistent units between merge and visualization
        - Automatically applies merge strategy before coloring
        - Reduces configuration duplication
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - assay-merge-settings
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssayMergeSettingsReadList'
          description: ''
