  /api/v2/assay-range-configurations/:
    get:
      operationId: assay_range_configurations_list
      description: |-
        RESTful API endpoint for managing assay range configurations.

        Assay range configurations define color schemes for visualizing geochemical data
        on drill intervals, surface samples, and map displays. Each configuration specifies:
        - An element (e.g., Au, Cu, Ag)
        - Units (automatically derived from required AssayMergeSettings)
        - Multiple value ranges with associated colors and sizes
        - Default color for null or out-of-range values
        - Optional compositing settings for interval aggregation

        Each range item includes:
        - color: Hex color (#RRGGBB) for markers/drill traces
        - size: Context-dependent size value (default: 2)
            * 2D Maps: Pixels for marker diameter and line width
            * 3D Models: Meters for drill trace cylinder diameter
        - label: Optional human-readable label (e.g., 'High Grade')
        - order: Display ordering for legend/UI

        ## Base URL
        `/api/v1/assay-range-configurations/`

        ## Key Features
        - Natural key lookups (name + project name + company name)
        - Nested range item creation and updates
        - Copy configurations between projects
        - Color format validation (#RRGGBB hex format)
        - Range overlap detection
        - Soft delete with restore capability
        - Required integration with AssayMergeSettings for consistent units
        - Optional compositing for length-weighted interval averaging

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access configurations from projects they have permission to view.

        ## Use Cases

        ### Visualization
        - Display drill core intervals colored by gold grade
        - Show surface samples colored by copper concentration
        - Create heat maps of mineralization intensity

        ### Quality Control
        - Quickly identify high-grade intercepts
        - Spot anomalous assay values
        - Compare grade distributions across drill holes

        ### Reporting
        - Generate colored cross-sections for reports
        - Export 3D models with grade-based coloring to Blender
        - Create presentation graphics with standardized color schemes

        ## Example Configuration

        Gold high-grade color scheme with progressive sizing:
        - 0-0.1 ppm: Dark Blue, size 2 (background)
        - 0.1-0.5 ppm: Blue, size 4 (low grade)
        - 0.5-1.0 ppm: Yellow, size 6 (medium grade)
        - 1.0-5.0 ppm: Orange, size 8 (high grade)
        - 5.0+ ppm: Red, size 10 (very high grade)

        The size field is context-dependent:
        - 2D Maps: Size in pixels (marker diameter and line width)
        - 3D Models: Size in meters (drill trace cylinder diameter)
        This allows visual emphasis of higher-grade intervals in both contexts.

        ## Query Parameters

        - `project_id` - Filter to specific project (integer ID)
        - `element` - Filter to specific element (e.g., "Au", "Cu")
        - `is_active` - Filter to active configurations (true/false)

        ## Custom Actions

        - `POST /api/v1/assay-range-configurations/{id}/restore/` - Restore soft-deleted configuration
        - `POST /api/v1/assay-range-configurations/{id}/copy_to_project/` - Copy configuration to another project
        - `POST /api/v1/assay-range-configurations/{id}/activate/` - Set as active configuration for the element
        - `POST /api/v1/assay-range-configurations/{id}/deactivate/` - Deactivate configuration

        ## Integration with AssayMergeSettings (Required)

        Every AssayRangeConfiguration MUST link to an AssayMergeSettings instance via the
        `assay_merge_settings` foreign key field (required, not null):
        - Units are automatically derived from merge settings (element-specific or default)
        - Ensures consistency between data processing and visualization
        - Centralizes unit definitions and merge strategy

        Example workflow:
        1. Create an AssayMergeSettings configuration (see `/api/v1/assay-merge-settings/`)
        2. Set it to convert Au to g/t, Cu to pct with appropriate merge strategy
        3. Create your AssayRangeConfiguration linked to these merge settings
        4. Units field in API response will automatically show the correct units
        5. All visualizations will use merged/converted data with matching color schemes

        ## Compositing (Optional)

        Configurations can optionally enable compositing to aggregate sample intervals:
        - `enable_compositing`: Boolean to enable/disable compositing
        - `composite_interval`: Fixed interval length in meters (e.g., 5.0 for 5m composites)
        - `composite_alignment_offset`: Optional elevation grid alignment offset

        Compositing uses length-weighted averaging and can align to elevation grids
        (e.g., offset=0 for 1000m/1005m/1010m boundaries).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - assay-range-configurations
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssayRangeConfigurationReadList'
          description: ''
