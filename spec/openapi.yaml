    PhotoRead:
      type: object
      description: |-
        Read serializer for Photo model (GET operations).

        Returns:
            - Full photo metadata with EXIF-extracted GPS coordinates
            - Pre-signed S3 URLs for image and thumbnail
            - Natural keys for easy reference

        Note: Uses AuditFieldsMixin for created_by/last_edited_by (returns email addresses)
      properties:
        id:
          type: integer
          readOnly: true
        natural_key:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        category:
          $ref: '#/components/schemas/PhotoReadCategoryEnum'
        category_display:
          type: string
          readOnly: true
        original_filename:
          type: string
          nullable: true
          description: Original filename from upload (user-friendly identifier for
            API)
          maxLength: 255
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        elevation:
          type: number
          format: double
          nullable: true
        direction:
          type: number
          format: double
          nullable: true
          description: Compass bearing (0-360 deg) the camera faced when the photo
            was taken
        length_units:
          $ref: '#/components/schemas/LengthUnitsEnum'
        geometry:
          type: string
          readOnly: true
          nullable: true
        file_size:
          type: integer
          readOnly: true
          nullable: true
        image_url:
          type: string
          readOnly: true
        thumbnail_url:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited_by:
          type: string
          readOnly: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
      required:
      - category
      - category_display
      - created_by
      - date_created
      - file_size
      - geometry
      - id
      - image_url
      - last_edited
      - last_edited_by
      - natural_key
      - project
      - thumbnail_url
    PhotoReadCategoryEnum:
      enum:
      - GN
      - AL
      - LI
      - LH
      - PS
      - AC
      - FN
      - SR
      - DC
      - DH
      - DS
      - DL
      - DA
      - DM
      - DT
      - DV
      - RQ
      - VT
      - CS
      - WS
      - WQ
      - RD
      type: string
      description: |-
        * `GN` - General
        * `AL` - Alteration
        * `LI` - Lithology
        * `LH` - Landholding
        * `PS` - Point Sample
        * `AC` - Archaeology
        * `FN` - Field Note
        * `SR` - Structural Measurement
        * `DC` - Drill Collar
        * `DH` - Drill Photo
        * `DS` - Drill Sample
        * `DL` - Drill Lithology
        * `DA` - Drill Alteration
        * `DM` - Drill Mineralization
        * `DT` - Drill Structure
        * `DV` - Drill Vein
        * `RQ` - Drill RQD
        * `VT` - Vein Type
        * `CS` - Claim Stake
        * `WS` - Water Site
        * `WQ` - Water Quality
        * `RD` - Road
    PointSampleRead:
      type: object
      description: |-
        Serializer for reading PointSample data (GET operations).

        Returns comprehensive data with natural keys for all foreign keys and
        rich representations for images (including both IDs and natural keys).

        ## Fields

        - `id`: Database ID (read-only)
        - `name`: Sample identifier (lab bag ID)
        - `sequence_number`: Planning reference ID (e.g., SS-001)
        - `status`: Workflow state ('PL', 'AS', 'CO', 'SK')
        - `status_display`: Human-readable status
        - `display_name`: Best available name for display
        - `project`: Natural key object {"name": "...", "company": "..."}
        - `sample_type`: Type code (e.g., 'GRB', 'CHN', 'RCK')
        - `ps_type`: Point sample type reference (FK)
        - `lithology`: Lithology reference (FK)
        - `alteration`: Alteration reference (FK)
        - `assay`: Assay reference (FK)
        - `date_collected`: Collection date
        - `collected_by`: Collector name
        - `notes`: Additional notes
        - `length_units`: 'M' (meters) or 'FT' (feet)
        - `geometry`: Auto-calculated Point geometry (read-only)
        - `images`: Rich image representations

        ### Target Coordinates (planned location)

        - `target_latitude`, `target_longitude`, `target_elevation`, `target_epsg`

        ### Actual Coordinates (collected location)

        - Original: `latitude`, `longitude`, `elevation`, `epsg`, `xy_units`, `elevation_units`
        - Project CRS: `crs_easting`, `crs_northing`, `crs_elevation`, `crs_epsg`, `crs_xy_units`, `crs_elevation_units`
        - Proj4 Local: `proj4_easting`, `proj4_northing`, `proj4_elevation`, `proj4_string`, `proj4_xy_units`, `proj4_elevation_units`

        ### Assignment Fields

        - `assigned_to`: Field worker assigned to collect
        - `assigned_by`: Manager who made assignment
        - `assigned_date`: When assignment was made
        - `due_date`: Target collection date
      properties:
