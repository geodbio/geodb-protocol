  /api/v2/water-samples/{id}/:
    get:
      operationId: water_samples_retrieve
      description: |-
        RESTful API endpoint for managing water quality samples.

        A water sample represents a discrete sample collected from a water site,
        with field parameters and optional laboratory analysis data.

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Endpoints

        ### List Water Samples
        `GET /api/v1/water-samples/`

        Returns all water samples the authenticated user has access to.

        **Query Parameters:**
        - `project_id` (optional): Filter by specific project ID
        - `created_by_me` (optional): If 'true', filter to samples created by current user
        - `site_id` (optional): Filter by specific water site ID
        - `start_date` (optional): Filter by collection date >= start_date (YYYY-MM-DD)
        - `end_date` (optional): Filter by collection date <= end_date (YYYY-MM-DD)
        - `sample_type` (optional): Filter by sample type (REG, DUP, BLK, QC)

        ### Retrieve Single Sample
        `GET /api/v1/water-samples/{id}/`

        ### Create Water Sample
        `POST /api/v1/water-samples/`

        **Example Request:**
        ```json
        {
            "name": "MW01-20240115",
            "project": {
                "name": "Mine Water Monitoring",
                "company": "ACME Mining"
            },
            "site": {
                "site_id": "MW-01",
                "project": "Mine Water Monitoring",
                "company": "ACME Mining"
            },
            "date_collected": "2024-01-15",
            "time_collected": "10:30:00",
            "collected_by": "Jane Doe",
            "sample_type": "REG",
            "collection_method": "PUMP",
            "field_temp": 12.5,
            "field_ph": 7.2,
            "field_conductivity": 450.0,
            "field_do": 8.5,
            "water_level_depth": 25.3,
            "purge_volume": 15.0
        }
        ```

        ### Update Water Sample
        `PUT /api/v1/water-samples/{id}/` - Full update
        `PATCH /api/v1/water-samples/{id}/` - Partial update

        ### Delete Water Sample
        `DELETE /api/v1/water-samples/{id}/`

        Performs a soft delete (marks as deleted).

        ### Restore Water Sample
        `POST /api/v1/water-samples/{id}/restore/`

        Restores a previously soft-deleted sample.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Water Sample.
        required: true
      tags:
      - water-samples
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterSampleRead'
          description: ''
  /api/v2/water-sites/:
    get:
      operationId: water_sites_list
      description: Override list to add deleted_ids to paginated response.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - water-sites
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWaterSiteReadList'
          description: ''
  /api/v2/water-sites/{id}/:
    get:
      operationId: water_sites_retrieve
      description: |-
        RESTful API endpoint for managing water quality monitoring sites.

        A water site represents a sampling location for environmental water monitoring.
        Can be surface water (streams, rivers, lakes) or groundwater (monitoring wells).

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Endpoints

        ### List Water Sites
        `GET /api/v1/water-sites/`

        Returns all water sites the authenticated user has access to.

        **Query Parameters:**
        - `project_id` (optional): Filter by specific project ID
        - `created_by_me` (optional): If 'true', filter to sites created by current user
        - `site_type` (optional): Filter by site type (SW, GW, SP, PD, OT)
        - `status` (optional): Filter by status (AC, IN, AB)

        ### Retrieve Single Site
        `GET /api/v1/water-sites/{id}/`

        ### Create Water Site
        `POST /api/v1/water-sites/`

        **Example Request:**
        ```json
        {
            "name": "MW-01",
            "project": {
                "name": "Mine Water Monitoring",
                "company": "ACME Mining"
            },
            "site_type": "GW",
            "status": "AC",
            "latitude": 45.5231,
            "longitude": -122.6765,
            "elevation": 150.5,
            "epsg": 4326,
            "well_depth": 50.0,
            "screen_top": 35.0,
            "screen_bottom": 45.0,
            "length_units": "M",
            "date_installed": "2024-01-15"
        }
        ```

        ### Update Water Site
        `PUT /api/v1/water-sites/{id}/` - Full update
        `PATCH /api/v1/water-sites/{id}/` - Partial update

        ### Delete Water Site
        `DELETE /api/v1/water-sites/{id}/`

        Performs a soft delete (marks as deleted).

        ### Restore Water Site
        `POST /api/v1/water-sites/{id}/restore/`

        Restores a previously soft-deleted site.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Water Site.
        required: true
      tags:
      - water-sites
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterSiteRead'
          description: ''
components:
