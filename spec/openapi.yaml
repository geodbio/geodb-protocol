  /api/v2/drill-rqds/{id}/:
    get:
      operationId: drill_rqds_retrieve
      description: |-
        RESTful API endpoint for managing drill RQD (Rock Quality Designation) data.

        Drill RQD represents geotechnical rock quality and core recovery data
        for drill holes. RQD measures the percentage of intact core pieces >= 10cm,
        used in rock mass classification systems (RMR, Q-System, GSI).

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Base URL
        `/api/v1/drill-rqds/`

        ## Key Features
        - Natural key lookups (hole_id + depth_from + project + company)
        - Automatic depth unit conversion (meters <-> feet)
        - RQD classification (Excellent/Good/Fair/Poor/Very Poor)
        - Core recovery tracking (length and percentage)
        - ISRM weathering grades (W1-W5)
        - ISRM strength grades (R0-R6)
        - Fracture frequency logging
        - Filtering by RQD set (logging session/geologist)
        - Soft delete with restore capability
        - Deletion sync with deleted_ids array in response

        ## Filtering by RQD Set
        To retrieve RQD data for a specific logging set:
        ```
        GET /api/v1/drill-rqds/?drill_rqd_set=<set_id>
        ```

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access RQD data from projects they have permission to view.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Drill RQD.
