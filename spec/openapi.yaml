        Serializer for ElevationData model.

        Provides URLs for downloading GeoTIFF and point cloud files,
        along with metadata and links for:
        - Terrain meshes (DEM meshes for 3D visualization)
        - Satellite imagery (RGB satellite textures)
        - Topographic imagery (USGS topo map textures)

        These assets are automatically generated in the elevation workflow
        and stored in Digital Ocean Spaces CDN for direct client access.
