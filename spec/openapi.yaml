  /api/v2/custom-field-schemas/:
    get:
      operationId: custom_field_schemas_list
      description: |-
        RESTful API endpoint for managing custom field schemas.

        Custom field schemas define project-specific fields for any geodata model type.
        Each project can have ONE schema per model type (e.g., one for DrillCollar,
        one for DrillSample). Schemas contain field definitions that specify:

        - field_name: Internal key for JSON storage (lowercase, underscores)
        - display_name: Human-readable label for forms/displays
        - field_type: Data type (text, number, decimal, date, boolean, choice, url)
        - choices: Valid options for 'choice' type fields
        - required: Whether the field is mandatory
        - min_value/max_value: Numeric validation bounds
        - order: Display ordering in forms

        ## Base URL
        `/api/v1/custom-field-schemas/`

        ## Key Features
        - One schema per project per model type (enforced by unique constraint)
        - Nested field definition creation and updates
        - Field type validation (choice fields need choices, numeric fields get bounds)
        - Soft delete with restore capability
        - Automatic audit trail (created_by, last_edited_by)

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        - Users can only access schemas from projects they have permission to view
        - Only 'creator', 'owner', 'manager' can create/edit/delete schemas
        - 'admin', 'adder', 'viewer' can read schemas

