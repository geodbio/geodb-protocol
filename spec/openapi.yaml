    DrillTraceRead:
      type: object
      description: |-
        Read-only serializer for DrillTrace model.

        Returns comprehensive trace information including collar details,
        trace data (depths + coordinates), and metadata.

        The geometry_wgs84 field provides WGS84 (EPSG:4326) coordinates for
        mapping applications like QGIS or Leaflet. This is derived from the
        geometry_3d field which stores the trace already transformed to WGS84.

        Note: trace_data.coords contains local grid coordinates (project CRS with
        custom origin offset) - use geometry_wgs84 for standard mapping.
      properties:
        id:
          type: integer
          readOnly: true
        bhid:
          type: integer
        collar_name:
          type: string
          readOnly: true
        project:
          type: integer
        project_name:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEb3Enum'
          description: |-
            Desurvey calculation method

            * `minimum_curvature` - Minimum Curvature
            * `tangential` - Tangential
            * `average_angle` - Average Angle
            * `radius_curvature` - Radius of Curvature
        resolution_meters:
          type: number
          format: double
          description: Spacing between trace points (meters)
        trace_data:
          description: 'Desurveyed coordinates: {depths: [...], coords: [[x,y,z],
            ...], method: str, survey_count: int, max_depth: float}'
        geometry_wgs84:
          type: string
          readOnly: true
        survey_count:
          type: integer
          readOnly: true
          description: Number of surveys used for desurvey
        max_depth:
          type: number
          format: double
          readOnly: true
          description: Maximum depth of trace (meters)
        point_count:
          type: string
          readOnly: true
        last_calculated:
          type: string
          format: date-time
          readOnly: true
        needs_recalculation:
          type: boolean
          readOnly: true
      required:
      - bhid
      - collar_name
      - company_name
      - geometry_wgs84
      - id
      - last_calculated
      - max_depth
      - needs_recalculation
      - point_count
      - project
      - project_name
      - survey_count
      - trace_data
