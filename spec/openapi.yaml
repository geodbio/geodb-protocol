        The `project` parameter is **required** to retrieve textures:
        ```
        GET /api/v1/textures/?project=<project_id>
        ```

        Returns 400 Bad Request if project parameter is not provided.

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access texture data from projects they have permission to view.
