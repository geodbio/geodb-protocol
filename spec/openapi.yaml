  /api/v2/drill-traces/:
    get:
      operationId: drill_traces_list
      description: |-
        RESTful API endpoint for accessing desurveyed drill hole traces.

        Provides read-only access to pre-calculated drill traces. For creating/updating
        traces, use the POST endpoints or management commands.

        ## Base URL

        `/api/v1/drill-traces/`

        ## Endpoints

        ### List Drill Traces
        `GET /api/v1/drill-traces/`

        Returns a list of all drill traces the authenticated user has access to.
        Uses lightweight serializer (no full trace data) for performance.

        **Query Parameters:**
        - `project_id` (optional): Filter by specific project ID
        - `collar_id` (optional): Filter by specific collar ID
        - `needs_recalculation` (optional): Filter by cache status (true/false)

        **Example:**
        ```bash
        curl -H "Authorization: Token YOUR_TOKEN" \
             "https://api.example.com/api/v1/drill-traces/?project_id=123"
        ```

        **Response:**
        ```json
        {
            "count": 10,
            "results": [
                {
                    "id": 1,
                    "bhid": 5,
                    "collar_name": "DDH-001",
                    "project": 123,
                    "project_name": "Gold Mountain",
                    "method": "minimum_curvature",
                    "resolution_meters": 1.0,
                    "survey_count": 5,
                    "max_depth": 500.0,
                    "point_count": 501,
                    "last_calculated": "2025-01-18T10:30:00Z",
                    "needs_recalculation": false
                }
            ]
        }
        ```

        ### Retrieve Single Trace
        `GET /api/v1/drill-traces/{id}/`

        Returns detailed trace information including full coordinate data.

        **Example:**
        ```bash
        curl -H "Authorization: Token YOUR_TOKEN" \
             "https://api.example.com/api/v1/drill-traces/1/"
        ```

        **Response:**
        ```json
        {
            "id": 1,
            "bhid": 5,
            "collar_name": "DDH-001",
            "project": 123,
            "project_name": "Gold Mountain",
            "company_name": "ACME Mining",
            "method": "minimum_curvature",
            "resolution_meters": 1.0,
            "trace_data": {
                "depths": [0, 1, 2, ..., 500],
                "coords": [
                    [-122.6765, 45.5231, 150.5],
                    [-122.6765, 45.5231, 149.5],
                    ...
                ],
                "method": "minimum_curvature",
                "survey_count": 5,
                "max_depth": 500.0
            },
            "survey_count": 5,
            "max_depth": 500.0,
            "point_count": 501,
            "last_calculated": "2025-01-18T10:30:00Z",
            "needs_recalculation": false
