    LandHoldingOutline:
      type: object
      description: |-
        OUTLINE view of a land holding — for vendor GRANTS only.

        Used when the project's ``protocol_include_land_holdings`` is ``outline``.
        Answers "where are the claims and are they alive?" without disclosing the
        claim-maintenance posture: no serial number, no staking dates, no county/BLM
        filing detail, no notes, no purchase order, no retain records, no attachments.
        Those are what tell a reader when a claim lapses and how to challenge or jump
        it — see ``api/grant_surface.LAND_HOLDING_OUTLINE_FIELDS``.

        ⛔ This is a SEPARATE serializer, deliberately. The gate is applied by
        SELECTING this class at the grant seam (LandHoldingViewSet.get_serializer_class),
        NOT by stripping fields from ``LandHoldingReadSerializer`` — which QGIS, mobile
        and Blender rely on for full filing detail and which must never change shape.
        Do not "simplify" this by mutating the shared read serializer's field list.

        ``detailed`` mode does NOT use this class: it returns the shared
        LandHoldingReadSerializer, i.e. byte-identical to what a Knox client sees.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        project:
          type: string
          readOnly: true
        county:
          type: string
          readOnly: true
          nullable: true
        state:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/StateEnum'
          - $ref: '#/components/schemas/NullEnum'
        claim_status:
          allOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          readOnly: true
        claim_status_display:
          type: string
          readOnly: true
        geometry:
          type: string
          readOnly: true
          nullable: true
        epsg:
          type: integer
          readOnly: true
          nullable: true
        acreage:
          type: string
          readOnly: true
      required:
      - acreage
      - claim_status
      - claim_status_display
      - county
      - epsg
      - geometry
      - id
      - name
      - project
      - state
