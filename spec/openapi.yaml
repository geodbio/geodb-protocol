        `/api/v1/drill-lithologies/`

        ## Key Features
        - Natural key lookups (hole_id + depth_from + project + company)
        - Automatic depth unit conversion (meters ↔ feet)
        - Flexible image references (IDs or natural keys)
        - Overlap detection (validates intervals don't overlap)
        - Lithology and texture references
        - Filtering by lithology set (logging session/geologist)
        - Soft delete with restore capability
        - Deletion sync with deleted_ids array in response

        ## Filtering by Lithology Set
        To retrieve lithology data for a specific logging set:
        ```
        GET /api/v1/drill-lithologies/?drill_lithology_set=<set_id>
        ```

        ## Authentication
        All endpoints require Knox token authentication.

        ## Permissions
        Users can only access lithology data from projects they have permission to view.
