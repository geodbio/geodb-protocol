          format: double
          nullable: true
          description: Flow correction factor (typically 0.80 for natural streams)
        flow_rate:
          type: number
          format: double
          nullable: true
          description: Calculated flow rate/discharge (m³/s, ft³/s, or L/s)
        flow_calculation_method:
          nullable: true
          description: |-
            Method used to calculate flow rate

            * `VA` - Velocity-Area Method
            * `MANNING` - Manning Equation
            * `WEIR` - Weir/Flume
            * `MANUAL` - Manual Entry (No Calculation)
          oneOf:
          - $ref: '#/components/schemas/FlowCalculationMethodEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
