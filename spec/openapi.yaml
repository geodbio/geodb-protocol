      description: |-
        RESTful API endpoint for managing drill lithology data.

        Drill lithology represents geological lithology logging intervals
        within drill holes, including rock types, textures, and descriptions.

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
