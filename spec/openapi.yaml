        curl -H "Authorization: Token YOUR_TOKEN" \
             "https://api.example.com/api/v1/drill-pads/blender/"
        ```

        **Response (200 OK):**
        ```json
        {
            "count": 2,
            "results": [
                {
                    "id": 1,
                    "name": "Pad 1",
                    "project": {"name": "Gold Mountain", "company": "ACME Mining"},
                    "status": "built",
                    "elevation": 1520.5,
                    "local_grid": {
                        "vertices_2d": [[100.5, 200.3], [150.2, 200.3], ...],
                        "vertices_3d": [[100.5, 200.3, 1520.5], ...],
                        "centroid": [125.35, 225.2, 1520.5],
                        "wkt_local": "POLYGON((100.50 200.30, ...))",
                        "proj4_string": "+proj=tmerc ..."
                    },
                    "location": {"type": "Point", "coordinates": [-116.5, 47.5]},
                    "polygon": {"type": "Polygon", "coordinates": [...]},
                    "hole_count": 5
                }
            ]
        }
        ```

        **Notes:**
        - Requires project to have local grid configured (effective_epsg)
        - If a pad has no polygon but has a location point, a default 30m x 30m
          square polygon is generated (matching QGIS plugin behavior)
        - Elevation defaults to 0 if not set on the drill pad
        - All local grid coordinates are in meters

        **Response Fields:**
        - `local_grid.vertices_2d`: 2D polygon vertices for flat visualization
        - `local_grid.vertices_3d`: 3D polygon vertices with elevation
        - `local_grid.centroid`: Center point for placing drill hole collars
        - `local_grid.wkt_local`: WKT string in local grid (for debugging)
        - `local_grid.proj4_string`: Project's coordinate system definition
      tags:
      - drill-pads
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrillPadRead'
          description: ''
