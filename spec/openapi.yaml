        * `ratio` - Ratio / index
        * `other` - Other
    AssayMergeSettingsRead:
      type: object
      description: |-
        Read-only serializer for AssayMergeSettings with nested element overrides.

        Includes all configuration details and related element-specific overrides.
        Used for list and retrieve operations.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Name for this merge settings configuration
          maxLength: 100
        project:
          type: integer
          nullable: true
          description: Project these settings apply to
        project_name:
          type: string
          readOnly: true
        company_name:
          type: string
          readOnly: true
        default_strategy:
          allOf:
          - $ref: '#/components/schemas/DefaultStrategyEnum'
          description: |-
            Default merge strategy for all elements

            * `high` - Highest Value
            * `low` - Lowest Value
            * `average` - Average
        default_strategy_display:
          type: string
          readOnly: true
        default_units:
          allOf:
          - $ref: '#/components/schemas/DefaultUnitsEnum'
          description: |-
            Default target units for all elements

            * `ppm` - Parts Per Million (ppm)
            * `ppb` - Parts Per Billion (ppb)
            * `pct` - Percent (%)
            * `opt` - Ounces Per Ton (oz/t)
        default_units_display:
          type: string
          readOnly: true
        convert_bdl:
          type: boolean
          description: Convert Below Detection Limit values to numeric estimates
        bdl_multiplier:
          type: number
          format: double
          description: Fraction of detection limit to use for BDL values (0.0-1.0)
        element_overrides:
          type: array
          items:
            $ref: '#/components/schemas/AssayMergeSettingsUnit'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited_by:
          type: integer
          readOnly: true
          nullable: true
        last_edited_by_name:
          type: string
          readOnly: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
          readOnly: true
      required:
      - company_name
      - created_by
      - created_by_name
      - date_created
      - default_strategy_display
      - default_units_display
      - element_overrides
      - id
      - last_edited
      - last_edited_by
      - last_edited_by_name
      - mark_deleted
      - project_name
    AssayMergeSettingsUnit:
      type: object
      description: |-
        Serializer for per-element merge configuration overrides.

        Allows specifying different merge strategies, units, or method filtering
        for individual elements (e.g., use 'average' for Cu but 'high' for Au).
      properties:
        id:
          type: integer
          readOnly: true
        element:
          type: string
          description: Element symbol (e.g., Au, Cu, Ag)
          maxLength: 10
        target_units:
          allOf:
          - $ref: '#/components/schemas/TargetUnitsEnum'
          description: |-
            Target units for this element

            * `ppb` - parts per billion
            * `ppm` - parts per million
            * `pct` - percent
            * `opt` - ounces per ton
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          description: |-
            Merge strategy: high, low, or average

            * `high` - Highest Value
            * `low` - Lowest Value
            * `average` - Average Value
        method_type_filter:
          nullable: true
          description: |-
            Legacy field - use digestion_filter/finish_filter instead

            * `FA` - Fire Assay
            * `AR` - Aqua Regia
            * `MA` - Multi Acid
            * `TI` - Titration
            * `XRF` - X-ray fluorescence
            * `PA` - Photon Assay
            * `ICP` - ICP-MS/ICP-OES
            * `IC` - Ion Chromatography
            * `AA` - Atomic Absorption
            * `SM` - Standard Methods
            * `EPA` - EPA Methods
            * `WQ` - Water Quality
            * `OT` - Other
          oneOf:
          - $ref: '#/components/schemas/MethodTypeFilterEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        digestion_filter:
          type: integer
          nullable: true
          description: 'Optional: Only use assays from this digestion method'
        digestion_filter_display:
          type: string
          readOnly: true
        finish_filter:
          type: integer
          nullable: true
          description: 'Optional: Only use assays from this finish method'
        finish_filter_display:
          type: string
          readOnly: true
      required:
      - digestion_filter_display
      - element
      - finish_filter_display
      - id
      - strategy
      - target_units
    AssayRangeConfigurationRead:
      type: object
      description: |-
        Read-only serializer for AssayRangeConfiguration with nested range items.

        Returns complete configuration data including all range items with their
        colors, labels, and ordering. Uses natural keys for the project reference.
        Units are automatically derived from the linked AssayMergeSettings.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Descriptive name for this configuration (e.g., 'Gold High Grade',
            'Copper Exploration')
          maxLength: 100
        project:
          type: string
          readOnly: true
        element:
          type: string
          description: Analyte symbol to visualize. Usually an element (Au, Cu) but
            may be a compound species (CaF2, SiO2, Al2O3) or other analyte the project
            assays. NOT restricted to a static element list — the form/tool layer
            constrains the picker to analytes this project actually has assay data
            for (Assay.project_analyte_symbols). Mirrors StandardUnit.element.
          maxLength: 20
        element_display:
          type: string
          readOnly: true
        units:
          type: string
          readOnly: true
        assay_merge_settings:
          type: integer
          description: Merge settings for unit conversion and merge strategy. Required
            for proper assay data handling.
        description:
          type: string
          nullable: true
          description: Optional description of this configuration
        default_color:
          type: string
          description: 'Color for values outside defined ranges or null values (hex
            format: #RRGGBB)'
          maxLength: 7
        is_active:
          type: boolean
          description: Whether this configuration is currently active for the project
        enable_compositing:
          type: boolean
          description: Enable compositing of assay intervals before visualization
        composite_interval:
          type: number
          format: double
          minimum: 0.1
          nullable: true
          description: Length of composite intervals in meters (e.g., 5.0 for 5-meter
            composites)
        composite_alignment_offset:
          type: number
          format: double
          minimum: 0.0
          nullable: true
          description: 'Optional: Offset for aligning composites to elevation grid.
            E.g., 0 for 1000m/1005m/1010m, 2 for 1002m/1007m/1012m'
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/AssayRangeItem'
          readOnly: true
        created_by:
          type: string
          readOnly: true
        last_edited_by:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        mark_deleted:
          type: boolean
          default: false
        date_marked_deleted:
          type: string
          format: date
          nullable: true
