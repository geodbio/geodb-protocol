            - restore: POST /api/v1/photos/{id}/restore/ - Restore soft-deleted photo

        Filters:
            - ?project_id={id} - Filter by project
            - ?category={category_code} - Filter by category (DRL, MAP, FLD, etc.)

        File Upload:
            - Content-Type: multipart/form-data
            - Field name: "image"
            - Max size: 50MB (configurable)
            - Allowed types: jpg, jpeg, png, tif

        EXIF Extraction:
            - GPS coordinates (lat/lon/elevation) extracted automatically
            - Manual coordinates can override EXIF data
            - Thumbnail auto-generated at 750x750px
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
