        Each texture has a name, type (lithology/alteration/mineral/vein),
        description, and color for visualization.

        ## Base URL
        `/api/v1/textures/`

        ## Key Features
        - Natural key lookups (name + project + company)
        - Color field for visualization in 3D viewers and logs
        - Type classification (Lithology, Alteration, Mineral, Vein)
        - Project-specific texture types
        - Full CRUD operations
        - Filterable by project

        ## Use Cases
        1. **Modal Configuration**: Fetch all textures for a project to populate selection UI
        2. **Color Mapping**: Get color codes for rendering texture descriptors
        3. **Data Entry**: Create/update texture types for a project

