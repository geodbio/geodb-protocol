  /api/v2/mapping-areas/{id}/:
    get:
      operationId: mapping_areas_retrieve
      description: |-
        ViewSet for managing individual mapping areas.

        Mapping areas can be auto-generated from a grid or user-defined from the mobile app.
        Field geologists receive assigned areas, create sketches, and upload completed work.

        ## Deletion Sync Support

        This endpoint supports incremental deletion sync for client apps (Mobile, Blender).
        See DrillCollarViewSet docstring for full documentation on deleted_since parameter.

        ## Base URL

        `/api/v1/mapping-areas/` (non-paginated)
        `/api/v2/mapping-areas/` (paginated)

        ## Endpoints

        - `GET /api/v1/mapping-areas/` - List areas for active project
        - `GET /api/v1/mapping-areas/?assigned_to=me` - My assigned areas
        - `POST /api/v1/mapping-areas/` - Create user-defined area (mobile)
        - `PATCH /api/v1/mapping-areas/{id}/` - Update status, notes
        - `POST /api/v1/mapping-areas/{id}/upload-sketch/` - Upload completed PNG
        - `POST /api/v1/mapping-areas/bulk-assign/` - Bulk assignment
        - `GET /api/v1/mapping-areas/my-tasks/` - All assigned areas across projects (mobile sync)

        ## Query Parameters

        - `status`: Filter by status (comma-separated)
        - `assigned_to`: Filter by user ID, or 'me' for current user
        - `grid`: Filter by grid ID

        ## Permissions

        - Managers can view all areas and assign users
        - Field workers can only view their assigned areas
        - Only assigned users (or managers) can upload sketches
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Mapping Area.
        required: true
      tags:
      - mapping-areas
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
