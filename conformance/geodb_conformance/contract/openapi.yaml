  /api/v2/certificates/:
    get:
      operationId: certificates_list
      description: |-
        A laboratory job: the batch of samples one lab analysed and reported together, under one certificate number, on one date. This is what makes a value traceable — an assay row names the certificate that produced it, and the certificate names the laboratory that ran it.

        `status` is the record's state, and it matters before you trust the numbers: `preliminary` means a final report is still expected and will replace these values in place; `finalized` is the reported result; `unverified` means the VALUES are the operator's real numbers but the certificate record itself was reconstructed because the source data named no usable certificate. Anything that reports or signs off on assay data should be able to exclude the last of those.

        A laboratory sometimes splits one job across several certificate numbers on the same samples; `alt_certificate_numbers` carries the others, so a number read off a report matches on `name` OR any entry there.

        Paged. Pass `modified_since` to fetch only what changed, and read `deleted_ids` to learn what was removed — that feed is how deletions reach you, since deleted rows simply stop appearing.

        ⚠️ `modified_since` is DAY-granular: it returns everything changed on that day or later, so a repeated pull re-sends the current day's rows. Deduplicate by `id` rather than assuming a strict watermark.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: modified_since
        schema:
          type: string
        description: 'Incremental sync: only rows with last_edited >= the DATE part
          of this ISO 8601 date/datetime. DAY-granular — rows already modified on
          the same day are re-included; treat pulls as idempotent upserts keyed on
          id. The same-day over-inclusion is deliberate: under-including would silently
          lose an edit made after your previous pull on that day. Deletions are not
          reflected here; keep using deleted_since / deleted_ids. A value that cannot
          be parsed is REFUSED with 400 reason_code=invalid_parameter. When sent,
          the response echoes modified_since_applied.'
      - in: query
        name: deleted_since
        schema:
          type: string
        description: 'Deletion sync: restrict deleted_ids to records soft-deleted
          on or after the DATE part of this ISO 8601 date/datetime. DAY-granular and
          inclusive, for the same reason as modified_since — removal is idempotent,
          so over-including a deletion is harmless and under-including leaves a ghost
          record. Omit it on a first sync to receive every deleted id. The response
          echoes deleted_since_applied, and sync_timestamp is the value to send next
          time.'
      - in: query
        name: compact
        schema:
          type: string
        description: 'compact=1: lean sync serialization — flat scalars with FK ids
          (project_id, bhid_id, ...), raw extra_data dict, no nested natural keys
          / derived fields / geometry columns. Same pagination envelope and deleted_ids
          metadata. Assays inline their element values as flat dicts. Any other value
          = default rich shape.'
      - in: query
        name: skip_count
        schema:
          type: string
        description: 'skip_count=1: suppress the per-page COUNT(*). count is null;
          next is present exactly while a full page was returned.'
      tags:
      - Assays
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCertificateReadList'
          description: ''
        '400':
          description: The request could not be understood (see `reason_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'No usable credential. `reason_code` distinguishes a revoked
            grant from an expired, unknown or malformed one; the response carries
            `WWW-Authenticate: Grant`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The credential is valid but not permitted this operation —
            outside the grant surface, a write with a read-only grant, or outside
            a room-pinned grant's room.
          content:
            application/json:
