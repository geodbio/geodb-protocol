          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The grant's request rate was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent on every throttled
                response.
              schema:
                type: integer
