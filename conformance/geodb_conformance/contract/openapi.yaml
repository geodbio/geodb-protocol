  /api/v2/assays/:
    get:
      operationId: assays_list
      description: |-
        Laboratory results for a sample, as a row of per-element values in `elements[]`.

        ⚠️ Every value is a DECIMAL STRING, not a JSON number: parsing it as a float silently rounds what the laboratory reported. Parse it with a decimal type.

        ⚠️ Units are PER VALUE, not per sample and not per element — one sample can carry results from two laboratories at different units, so read `units` beside each value rather than assuming a project-wide unit.

        Paged. Pass `modified_since` to fetch only what changed, and read `deleted_ids` to learn what was removed — that feed is how deletions reach you, since deleted rows simply stop appearing.

        ⚠️ `modified_since` is DAY-granular: it returns everything changed on that day or later, so a repeated pull re-sends the current day's rows. Deduplicate by `id` rather than assuming a strict watermark.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: modified_since
        schema:
          type: string
        description: 'Incremental sync: only rows with last_edited >= the DATE part
          of this ISO 8601 date/datetime. DAY-granular — rows already modified on
          the same day are re-included; treat pulls as idempotent upserts keyed on
          id. The same-day over-inclusion is deliberate: under-including would silently
          lose an edit made after your previous pull on that day. Deletions are not
          reflected here; keep using deleted_since / deleted_ids. A value that cannot
          be parsed is REFUSED with 400 reason_code=invalid_parameter. When sent,
          the response echoes modified_since_applied.'
      - in: query
        name: compact
        schema:
          type: string
        description: 'compact=1: lean sync serialization — flat scalars with FK ids
          (project_id, bhid_id, ...), raw extra_data dict, no nested natural keys
          / derived fields / geometry columns. Same pagination envelope and deleted_ids
          metadata. Assays inline their element values as flat dicts. Any other value
          = default rich shape.'
      - in: query
        name: skip_count
        schema:
          type: string
        description: 'skip_count=1: suppress the per-page COUNT(*). count is null;
          next is present exactly while a full page was returned.'
      tags:
      - Assays
      security:
      - knoxApiToken: []
      - GrantAuth: []
