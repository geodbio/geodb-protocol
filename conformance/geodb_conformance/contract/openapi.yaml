openapi: 3.0.3
info:
  title: geoDB Exploration Data API
  version: 0.1.0
  description: |
    Read-only access to one exploration project's data — drill holes and what was
    logged down them, samples, laboratory results, quality control, surface
    geology, maps and files.

    ## Getting in

    The project owner issues you an access grant and sends you the token. Use it
    on every request:

        Authorization: Grant <token>

    The grant is pinned to ONE project and is read-only. It can be revoked at any
    moment, and every request you make appears in a log the project owner can
    read. `GET /api/v2/grant-context/` tells you which project you are in and what
    the limits are — the cheapest first call to make.

    ## Six things that will catch you out

    1. **Coordinates are not degrees.** `latitude` and `longitude` hold the
       ORIGINAL imported coordinate in the system named by `epsg` — for a UTM
       project that is northing and easting in metres. They are degrees only when
       `epsg` is 4326. For WGS84, read `geometry` or `geometry_geojson`. This is
       deliberate: the numbers the customer imported are kept exactly as they
       arrived.
    2. **Assay values are decimal STRINGS.** Parsing one as a float silently
       rounds what the laboratory reported. Parse with a decimal type.
    3. **Units travel with the value.** `units` is per VALUE, not per sample and
       not per element — one sample can carry results from two laboratories at
       different units. Depths carry `length_units` per record.
    4. **Custom fields are discovered, not assumed.** Any `cf_*` key may appear on
       a record; which ones exist varies by project and by record type. Read
       `GET /api/v2/model-schemas/` first.
    5. **Deletions arrive as `deleted_ids`, not as absences.** A deleted row stops
       appearing, so a client that only adds what it sees never removes anything.
       Read the `deleted_ids` array on every page.
    6. **`modified_since` is DAY-granular.** It returns everything changed on that
       day or later, so a repeated pull re-sends the current day's rows.
       Deduplicate by `id` rather than treating it as a strict watermark.

    ## Bulk

    For a whole table, `POST /api/v2/exports/` builds GeoParquet, Parquet or CSV
    in the background instead of making you page a large list. For large binary
    assets — imagery, grids, geophysical volumes — use the STAC catalog under
    `/api/v2/stac/`.
