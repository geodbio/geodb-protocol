      operationId: water_sites_retrieve
      description: |-
        A location where water is monitored or sampled.

        ⚠️ `latitude` / `longitude` are the ORIGINAL imported coordinate in the CRS named by `epsg`. Read `geometry` for WGS84.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Water Site.
        required: true
      tags:
      - Water
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterSiteRead'
          description: ''
        '400':
          description: The request could not be understood (see `reason_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'No usable credential. `reason_code` distinguishes a revoked
            grant from an expired, unknown or malformed one; the response carries
            `WWW-Authenticate: Grant`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The credential is valid but not permitted this operation —
            outside the grant surface, a write with a read-only grant, or outside
            a room-pinned grant's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such resource inside this credential's scope. A row in another
            project is indistinguishable from one that does not exist, by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The grant's request rate was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent on every throttled
                response.
              schema:
                type: integer
      summary: Get one of the water monitoring sites
      x-geodb-extension: true
components:
  schemas:
    AcquisitionTypeEnum:
      enum:
      - ground
      - airborne
      - downhole
      type: string
      description: |-
        * `ground` - Ground
        * `airborne` - Airborne
        * `downhole` - Downhole
    AlterationNested:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
      required:
      - id
      - name
      additionalProperties: false
    AlterationRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Natural key of the project: `{"name", "company"}`.'
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
        fgdc_pattern_id:
          type: integer
          readOnly: true
          nullable: true
          description: FGDC geologic-map pattern id. Null renders the solid color.
        image_url:
          type: string
          readOnly: true
          nullable: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - date_created
      - fgdc_pattern_id
      - id
      - image_url
      - last_edited
      - name
      - project
      patternProperties:
        ^cf_[a-z0-9_]+$:
          description: 'Custom field. Any number of `cf_*` keys may be present: they
            are the project''s user-defined fields, flattened to top level. The set
            of keys and their types vary BY PROJECT and BY MODEL — discover them at
            `/api/v2/model-schemas/?project_id=<id>`, never by assuming a fixed set.
            Values are whatever the customer stored (string, number, boolean or null).
            Calculated custom fields appear under the same prefix and are read-only.'
      additionalProperties: false
    AnalyteTypeEnum:
      enum:
      - element
      - soluble
      - sg
      - oxide
      - loi
      - ratio
      - other
      type: string
      description: |-
        * `element` - Element symbol (Au, Cu, Fe...)
        * `soluble` - Soluble fraction (Cu-Sol...)
        * `sg` - Specific gravity
        * `oxide` - Oxide species (Al2O3, Fe2O3...)
        * `loi` - Loss on ignition
        * `ratio` - Ratio / index
        * `other` - Other
    AssayRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        project:
          type: object
          description: The project this assay belongs to, as an identity object rather
            than a bare id, so a reference stays meaningful across exports.
          properties:
            id:
              type: integer
            name:
              type: string
            company:
              type: string
          readOnly: true
        certificate:
          type: object
          nullable: true
          description: The lab job that created this row, as an identity object. On
            a merged row (one sample, two labs) the values may come from a different
            job — read the per-value `elements[].certificate` for provenance.
          properties:
            id:
              type: integer
            name:
              type: string
            laboratory:
              type: string
              nullable: true
            analysis_date:
              type: string
              format: date
              nullable: true
            status:
              type: string
            date_preliminary:
              type: string
              format: date
              nullable: true
            natural_key:
              type: object
              properties:
                name:
                  type: string
                project:
                  type: string
                company:
                  type: string
          readOnly: true
        weight:
          type: number
          format: double
          readOnly: true
          nullable: true
        detection_limit_per_sample:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-sample detection limit reported by the lab when a method
            has variable DL (Method.is_floating_dl=True). For BDL rows the AssayUnit
            stores value=-1 and this field carries the lab's reported '<X.XX' threshold.
        precision_per_sample:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
          description: Per-sample analytical precision (1-sigma error) reported by
            the lab. Drives the strip-log error whisker on the Au track for photon-assay
            samples. NULL for fixed-DL methods that only report a method-level precision.
        analyte_mass_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Actual sample mass loaded by the lab in grams. Distinct from
            the cutsheet's target mass — the lab reports what it really put on the
            instrument. Drives per-sample DL scaling on the photon-assay strip-log
            render.
        lab_status_code:
          readOnly: true
          description: |-
            Lab QC flag for this sample. BDL = below detection limit; HB / HET = heterogeneity flagged by lab (soft-warn, row imports normally); IS = insufficient sample (AssayUnit lands with value NULL); SNR = sample not received. Empty for samples with no flag.

            * `BDL` - Below Detection Limit
            * `HB` - Heterogeneity bias flagged by lab
            * `HET` - Heterogeneous
            * `IS` - Insufficient sample
            * `SNR` - Sample not received
          oneOf:
          - $ref: '#/components/schemas/LabStatusCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/AssayUnitNested'
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        qaqc_status:
          type: string
          readOnly: true
          nullable: true
      required:
      - analyte_mass_g
      - certificate
      - date_created
      - detection_limit_per_sample
      - elements
      - id
      - lab_status_code
      - name
      - precision_per_sample
      - project
      - qaqc_status
      - weight
      additionalProperties: false
    AssayUnitNested:
      type: object
      properties:
        element:
          type: string
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          description: 'The analyte value, as a DECIMAL STRING rather than a JSON
            number — precision is preserved exactly as the laboratory reported it,
            and parsing it as a float will silently round it. Parse it with a decimal
            type. Its units are the sibling `units` field: units are per VALUE, not
            per sample and not per element, because one sample can carry values from
            two laboratories at different units.'
        units:
          type: string
          readOnly: true
          description: Units for this value (e.g. `ppm`, `ppb`, `pct`, `g/t`, `oz/ton`).
            Per value — always read it beside the value rather than assuming a project-wide
            unit.
          nullable: true
        detection_limit:
          type: number
          nullable: true
          description: A method limit in the value's own units, or null when the method
            declares none. A float, unlike `value`, which is a decimal string because
            it is what the laboratory reported.
          readOnly: true
        upper_limit:
          type: number
          nullable: true
          description: A method limit in the value's own units, or null when the method
            declares none. A float, unlike `value`, which is a decimal string because
            it is what the laboratory reported.
          readOnly: true
        above_det_limit:
          type: boolean
        method:
          type: object
          nullable: true
          description: The analytical method that produced this value, as an identity
            object. `is_floating_dl` says whether the detection limit is reported
            per sample rather than fixed by the method.
          properties:
            id:
              type: integer
            name:
              type: string
            laboratory:
              type: string
              nullable: true
            is_floating_dl:
              type: boolean
            required_sample_mass_g:
              type: number
              nullable: true
            natural_key:
              type: object
              properties:
                name:
                  type: string
                laboratory:
                  type: string
                company:
                  type: string
          readOnly: true
        certificate:
          type: object
          nullable: true
          description: The lab job that produced THIS value. Differs from the row's
            certificate on a merged row; null when the value carries no stamp of its
            own and the row's job could not be resolved.
          properties:
            id:
              type: integer
            name:
              type: string
            laboratory:
              type: string
              nullable: true
          readOnly: true
      required:
      - above_det_limit
      - certificate
      - detection_limit
      - element
      - method
      - units
      - upper_limit
      - value
      additionalProperties: false
    BlankEnum:
      enum:
      - ''
    CertificateRead:
      type: object
      description: 'One laboratory job: who analysed what, when, and in what state.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        project:
          type: object
          description: The project this certificate belongs to, as an identity object
            rather than a bare id, so a reference stays meaningful across exports.
          properties:
            id:
              type: integer
            name:
              type: string
            company:
              type: string
          readOnly: true
        laboratory:
          type: object
          nullable: true
          description: The laboratory that issued this certificate, as an identity
            object. Null when the record does not name one.
          properties:
            id:
              type: integer
            name:
              type: string
          readOnly: true
        analysis_date:
          type: string
          format: date
          readOnly: true
          description: The date the laboratory reported this certificate.
        date_preliminary:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The date the preliminary report was received, when this record
            began as one. Null for a certificate that arrived finalized.
        status:
          allOf:
          - $ref: '#/components/schemas/CertificateReadStatusEnum'
          readOnly: true
          description: |-
            The state of this certificate record. `preliminary` — a final report is still expected and will replace these values in place; the numbers are usable but not yet the reported result. `finalized` — the reported result. `unverified` — the VALUES are the operator's real numbers, but this certificate record was reconstructed because the source data named no usable certificate; anything that reports or signs off on assay data should be able to exclude these.

            * `preliminary` - Preliminary
            * `finalized` - Finalized
            * `unverified` - Unverified (no certificate in source)
        batch_number:
          type: string
          readOnly: true
          nullable: true
          description: The laboratory's own batch number for this job, where the lab
            reports one. QC insertion rates are usually quoted per batch.
        weight_units:
          allOf:
          - $ref: '#/components/schemas/WeightUnitsEnum'
          readOnly: true
          description: |-
            The units the sample weights on this job were reported in.

            * `kg` - kilograms
            * `g` - grams
            * `lb` - pounds
            * `oz` - ounces
        alt_certificate_numbers:
          type: array
          items:
            type: string
          readOnly: true
          description: Other laboratory certificate numbers for the SAME job, when
            a lab split one job across several numbers on the same samples. Match
            a number you read on a report against `name` OR any entry here.
        methods:
          type: array
          description: The analytical methods reported on this certificate, as identity
            objects. The same method may appear on many certificates.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
          readOnly: true
        result_count:
          type: integer
          readOnly: true
          description: 'How many assay rows this certificate produced. A zero is INFORMATION,
            not an error: an intentionally empty placeholder certificate is a legitimate
            record to hold.'
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - alt_certificate_numbers
      - analysis_date
      - batch_number
      - date_created
      - date_preliminary
      - id
      - laboratory
      - last_edited
      - methods
      - name
      - project
      - result_count
      - status
      - weight_units
      additionalProperties: false
    CertificateReadStatusEnum:
