    post:
      operationId: exports_create
      description: |-
        Exports one table of the project as GeoParquet / Parquet / CSV.

        The export is not a raw table dump: it inherits the project's assay-merge settings, its output CRS (`odbc_output_crs` — coordinates are NOT forced to WGS84), its column configuration, its `cf_*` custom fields and its depth units — the same engine that produces the project's own CSV/XLSX exports and its ODBC feed.

        Returns 202 with a job id; poll `status_url`, then GET `/exports/{id}/download/` for a short-lived signed URL.
      summary: Create a bulk export job
      tags:
      - Bulk Export
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportCreateRequestRequest'
        required: true
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobAccepted'
          description: |-
            Accepted. The export runs in the background; nothing is returned inline.

            Poll `status_url` until the job reaches a terminal state, then GET `/exports/{id}/download/` for a short-lived signed URL.

            ⚠️ 202 does not mean a new job was started. This POST is IDEMPOTENT: an identical request while a job is queued or running returns THAT job, and a request that an existing artifact already answers returns it with `reused: true` and `state: done`. Resending after a network failure is safe and will not queue a second export.
        '429':
          description: |-
            Refused for one of TWO reasons — read `reason_code`, they need opposite reactions:

            * `throttled` — the grant's request RATE was exceeded. Wait for `Retry-After` and resend.
            * `export_concurrency` — this grant already holds the maximum number of export jobs that have not finished. Do NOT resend: poll the `status_url` of the jobs you already started, and a slot frees when one finishes. `offending` carries `in_flight` and `limit`.

            Both send `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent on every throttled
                response.
              schema:
                type: integer
        '400':
          description: The request could not be understood (see `reason_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'No usable credential. `reason_code` distinguishes a revoked
            grant from an expired, unknown or malformed one; the response carries
