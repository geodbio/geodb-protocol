          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        project:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Natural key of the project: `{"name", "company"}`.'
          readOnly: true
        pad:
          type: string
          readOnly: true
          nullable: true
        hole_type:
          type: string
          readOnly: true
          description: How the hole was drilled — the project's own drilling-method
            code (diamond core, reverse circulation, auger, and so on). Read the enum
            on this field for the values this server emits.
          nullable: true
        hole_status:
          type: string
          readOnly: true
          nullable: true
        hole_size:
          type: string
          readOnly: true
          nullable: true
        date_completed:
          type: string
          format: date
          nullable: true
        total_depth:
          type: number
          format: double
          nullable: true
          description: The final drilled depth of the hole, in `length_units`. The
            depth measured ALONG the hole, not a vertical depth.
        total_depth_label:
          type: string
          readOnly: true
          nullable: true
        azimuth:
          type: number
          format: double
          nullable: true
          description: Azimuth in DEGREES, clockwise from grid north (0–360). On a
            collar it is the orientation the hole was set up to drill; on a downhole
            survey station it is the measured orientation at that depth.
        dip:
          type: number
          format: double
          nullable: true
          description: 'Dip in DEGREES from horizontal. ⚠️ NEGATIVE IS DOWNWARD: a
            vertical hole drilled straight down is -90, a horizontal hole is 0. On
            a collar it is the set-up inclination; on a survey station it is the measured
            inclination at that depth.'
        display_units:
          type: string
          readOnly: true
          description: 'Units the *_display strings on this record are formatted in,
            from the project''s display preference. Presentation only: the stored
            values remain in `length_units`.'
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        longitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        epsg:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: EPSG code of the coordinate reference system that `latitude`,
            `longitude` and `source_coordinate` are expressed in — the CRS the data
            was imported in, preserved rather than normalised. Interpret those values
            against this code; they are degrees only when it is 4326. The derived
            WGS84 form is always in `geometry` / `geometry_geojson`.
        elevation:
          type: number
          format: double
          nullable: true
          description: Elevation of the collar, in `elevation_units`. See `elevation_source`
            for whether it was surveyed, taken from a DEM, or entered by hand.
        elevation_source:
          allOf:
          - $ref: '#/components/schemas/DrillCollarReadElevationSourceEnum'
          description: |-
            Source of elevation data for quality tracking

            * `surveyed` - Surveyed
            * `dem` - DEM
            * `manual` - Manual Entry
            * `unknown` - Unknown
        length_units:
          type: string
          readOnly: true
          description: 'Units the record''s DEPTH and LENGTH values are stored in:
            `M` (metres) or `FT` (feet). Stored units, not a display preference —
            read every depth against this.'
          nullable: true
