    ExportCreateRequestRequest:
      type: object
      properties:
        model:
          allOf:
          - $ref: '#/components/schemas/ModelEnum'
          description: |-
            The table to export. The drilling tables are the same ones geoDB serves over ODBC. drill_rqd_core_recovery and drill_rqd_rock_mass exist only on projects with the geotech tab split enabled; asking for one elsewhere returns 400 with the list of models that project does expose.

            * `drill_collars` - drill_collars
            * `drill_surveys` - drill_surveys
            * `drill_lithology` - drill_lithology
            * `drill_alteration` - drill_alteration
            * `drill_samples` - drill_samples
            * `drill_structure_point` - drill_structure_point
            * `drill_structure_zone` - drill_structure_zone
            * `drill_mineralization` - drill_mineralization
            * `drill_veins` - drill_veins
            * `drill_rqd` - drill_rqd
            * `drill_rqd_core_recovery` - drill_rqd_core_recovery
            * `drill_rqd_rock_mass` - drill_rqd_rock_mass
            * `drill_spectral` - drill_spectral
            * `drill_custom_intervals` - drill_custom_intervals
            * `point_samples` - point_samples
            * `qc_samples` - qc_samples
            * `geophysical_surveys` - geophysical_surveys
            * `vector_features` - vector_features
        format:
          allOf:
          - $ref: '#/components/schemas/FormatEnum'
          default: geoparquet
          description: |-
            geoparquet carries a WGS84 geometry column alongside the native/original coordinate columns; parquet and csv are non-spatial.

            * `geoparquet` - geoparquet
            * `parquet` - parquet
            * `csv` - csv
        include_assays:
          type: boolean
          default: true
          description: Merge assay results into the sample exports, using the project's
            assay-merge settings. Ignored by tables that carry no assays.
        vector_layer_id:
          type: integer
          nullable: true
          description: Only for model=vector_features. Narrows the export to a single
            vector map layer (homogeneous geometry + attribute schema). Omit to export
            every active layer in the project export vintage, with layer_id/layer_name/kind
            identity columns. Ignored by all other models.
      required:
      - model
    ExportJobAccepted:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Job id. Poll it at `status_url`.
        state:
          type: string
          description: 'The job''s state AT THIS MOMENT, not a blanket `queued`: an
            identical re-POST returns the job already in flight, which may already
            be running, and a reused artifact comes back `done`. Poll `status_url`
            for live state.'
        model:
          type: string
          description: Echo of the table being exported.
        format:
          type: string
          description: Echo of the format the artifact will be written in.
        status_url:
          type: string
          format: uri
          description: Absolute URL to poll. When the job reaches a terminal state,
            GET `/exports/{id}/download/` for a short-lived signed URL.
        reused:
          type: boolean
          description: 'True when this response hands back an artifact or a job that
            already existed — an identical re-POST is idempotent and does NOT start
            a second export. Not an error: the payload is the same one a fresh job
            would have produced.'
      required:
      - format
      - id
      - model
      - reused
      - state
      - status_url
      additionalProperties: false
