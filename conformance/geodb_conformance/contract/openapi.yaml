          Any other scope value is left to endpoint-specific meaning.'
      - in: query
        name: modified_since
        schema:
          type: string
        description: 'Incremental sync: only rows with last_edited >= the DATE part
          of this ISO 8601 date/datetime. DAY-granular — rows already modified on
          the same day are re-included; treat pulls as idempotent upserts keyed on
          id. The same-day over-inclusion is deliberate: under-including would silently
