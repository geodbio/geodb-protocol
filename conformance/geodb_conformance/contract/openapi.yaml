          nullable: true
        notes:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Attached records, each as an object carrying its id, its natural
            key and display metadata. Soft-deleted attachments are omitted.
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        source_coordinate:
          allOf:
          - $ref: '#/components/schemas/SourceCoordinate'
          nullable: true
          readOnly: true
        coordinate_system_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: The project's coordinate-system settings (declared EPSG, optional
            local-grid proj4 string, units). Present on every record whose model carries
            a location. Advisory metadata for clients that reproject; the per-record
            CRS is always the record's own `epsg`.
      required:
      - crs_easting
      - crs_elevation
      - crs_elevation_units
      - crs_epsg
      - crs_northing
      - crs_xy_units
      - date_created
      - geometry_geojson
      - id
      - images
      - last_edited
      - name
      - proj4_easting
      - proj4_elevation
      - proj4_elevation_units
      - proj4_northing
      - proj4_string
      - proj4_xy_units
      - project
      - source_coordinate
      - xy_units
      patternProperties:
        ^cf_[a-z0-9_]+$:
          description: 'Custom field. Any number of `cf_*` keys may be present: they
            are the project''s user-defined fields, flattened to top level. The set
            of keys and their types vary BY PROJECT and BY MODEL — discover them at
            `/api/v2/model-schemas/?project_id=<id>`, never by assuming a fixed set.
            Values are whatever the customer stored (string, number, boolean or null).
            Calculated custom fields appear under the same prefix and are read-only.'
      additionalProperties: false
    WaterSiteReadElevationSourceEnum:
      enum:
      - surveyed
      - dem
      - gps
      - manual
      - unknown
      type: string
      description: |-
        * `surveyed` - Surveyed
        * `dem` - DEM
        * `gps` - GPS
        * `manual` - Manual Entry
        * `unknown` - Unknown
    WaterSiteReadStatusEnum:
      enum:
      - AC
      - IN
      - AB
      type: string
      description: |-
        * `AC` - Active
        * `IN` - Inactive
        * `AB` - Abandoned
    WeatheringGradeEnum:
      enum:
      - W1
      - W2
      - W3
      - W4
      - W5
      type: string
      description: |-
        * `W1` - W1 - Fresh
        * `W2` - W2 - Slightly Weathered
        * `W3` - W3 - Moderately Weathered
        * `W4` - W4 - Highly Weathered
        * `W5` - W5 - Completely Weathered
    WeightUnitsEnum:
      enum:
      - kg
      - g
      - lb
      - oz
      type: string
      description: |-
        * `kg` - kilograms
        * `g` - grams
        * `lb` - pounds
        * `oz` - ounces
    ZoneTypeEnum:
      enum:
      - MRK
      - JRK
      - FOL
      - BRK
      - RUB
      - FLT
      - DISK
      - LOST
      - SOIL
      type: string
      description: |-
        * `MRK` - Massive Rock
        * `JRK` - Jointed Rock
        * `FOL` - Foliated Rock
        * `BRK` - Broken Core
        * `RUB` - Rubble
        * `FLT` - Fault
        * `DISK` - Disking
        * `LOST` - Lost Core
        * `SOIL` - Soil Like
    Error:
      type: object
      description: |-
        The ONE error shape. Every 4xx carries a stable machine `reason_code` and a `remedy` sentence saying what to do next.

        Authentication failures are distinguishable, which matters because a revoked credential must not look like a transient failure: `grant_revoked` (the owner revoked it — do not retry), `grant_expired` (ask the owner to rotate it), `grant_unknown` (no such grant), `grant_malformed` (the header is not `Authorization: Grant <token>`), `grant_invalid` (project or data-room state). Each also carries the short `grant_error` key (`revoked` | `expired` | `unknown` | `malformed` | `invalid`).

        Refusals by the grant gate use `grant_write_forbidden`, `grant_surface_forbidden`, `grant_no_read_capability`, `grant_room_pinned_*` and `use_v2` (a grant reads the /api/v2/ surface only).

        THE FULL REGISTER — every code, with its meaning, its remedy and whether retrying the identical request can ever help — is `errors.json` in the protocol repository: https://github.com/geodbio/geodb-protocol/blob/main/errors.json . It is generated from this server, so it cannot fall behind what is raised here. Enumerate it rather than matching on `detail` prose.

        Three different refusals answer 429 and they need DIFFERENT reactions: `throttled` (asking too often — back off and resend), `export_concurrency` (holding too many unfinished export jobs — poll the jobs you have, do NOT resend), and `grant_auth_throttled` (too many unknown credentials from this address — stop retrying and get a working grant). All three send `Retry-After`.

        Existing clients: DRF's own `detail` (and, for a validation failure, the per-field error keys) are still present and unchanged. The contract keys are additive.
      properties:
        reason_code:
          type: string
          description: Stable machine code. Enumerated in errors.json.
        detail:
          type: string
          description: 'One sentence: what was refused.'
        remedy:
          type: string
          nullable: true
          description: 'One sentence: what the caller does next. Null only where there
            is nothing the caller can do.'
        offending:
          type: object
          additionalProperties: true
          description: Names the offending identity when there is one (the parameter,
            the row, the external id). Never contains credential material.
        grant_error:
          type: string
          description: Short discriminator on grant authentication and gate refusals.
      required:
      - reason_code
      - detail
  securitySchemes:
    GrantAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Project-pinned, READ-ONLY vendor credential. Send the header `Authorization:
        Grant <token>`. Tokens are minted by a project owner under Project Settings
        → API Access Grants and are scoped to a single project; write methods are
        rejected.'
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: Grant
  description: 'What the credential you are holding can see: the project it is pinned
    to, its limits, and the protocol version this server speaks. The cheapest first
    call an integration can make.'
- name: Discovery
  description: 'What this project actually contains: which models carry data, which
    fields they have, and the project''s user-defined `cf_*` custom fields. Read this
    FIRST rather than assuming a fixed schema — custom fields vary by project and
    by model.'
- name: Drill Holes
  description: 'The holes themselves: collar location and orientation, the downhole
    survey stations that bend the trace, the pads holes are drilled from, and the
    computed trace. Start here — almost everything else in the drilling data references
    a hole.'
- name: Drill Intervals
  description: 'What was logged down a hole, as depth-from/depth-to intervals: lithology,
    alteration, structure, mineralization, veins, RQD and geotechnical runs, spectral
    scans, and user-defined interval types. Every record references its hole and carries
    its own depth units. The `*-sets` endpoints group intervals into named logging
    runs.'
- name: Samples
  description: 'Physical samples and where they came from: drill samples cut from
    an interval of core, and point samples collected at a location on surface. A sample
    is the join between the geology and the laboratory results.'
- name: Assays
  description: 'Laboratory results and the chain of custody behind them: the analyte
    values themselves, the certificates (lab jobs) that reported them, the analytical
    methods that produced them, the laboratories that ran them, and the per-project
    settings that decide how multiple results for one sample are merged. Values are
    decimal STRINGS and carry their own units — read both.'
- name: Quality Control
  description: 'The evidence that the assays can be trusted: QC samples inserted into
    the sample stream (standards, blanks, duplicates), the certified reference materials
    behind them, and the protocol a project holds itself to.'
- name: Surface Geology
  description: 'Geology observed at surface rather than down a hole: structural measurements,
    mapped lithology and alteration, formations, textures, vein types, minerals and
    assemblages, field notes, and the mapping areas and grids that organise the work.'
- name: Water
  description: Water monitoring sites and the samples taken at them.
- name: Geophysics
  description: Geophysical surveys and their acquisition metadata. Bulk geophysical
    data travels as STAC assets rather than as JSON rows.
- name: Land Holdings
  description: Mineral claims and other land holdings. ⚠️ A project chooses how much
    of this a grant may read — off, outline (geometry and status only), or detailed
    — so the fields present here depend on that setting, and `off` returns 403 rather
    than an empty list.
- name: Map Layers
  description: Vector map layers and their features, plus roads — the cartographic
    layers a project carries, as opposed to its measurements.
- name: Files
  description: Project files, their map tiles where they are georeferenced, and project
    elevation data.
- name: Photos
  description: Photographs, both core photography and general project photos.
- name: STAC Catalog
  description: A SpatioTemporal Asset Catalog over the project's large binary assets
    — imagery, grids, geophysical volumes. Use this rather than the JSON endpoints
    when you want the FILES; the asset endpoint redirects to a short-lived signed
    URL.
- name: Bulk Export
  description: 'Whole tables as GeoParquet, Parquet or CSV, built in the background.
    The right tool when you want everything: one POST instead of paging a large list.
    This is the only non-GET on the read surface.'
