          nullable: true
          readOnly: true
        geometry_geojson:
          allOf:
          - $ref: '#/components/schemas/GeoJSONPoint'
          nullable: true
          readOnly: true
        coordinate_system_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: The project's coordinate-system settings (declared EPSG, optional
            local-grid proj4 string, units). Present on every record whose model carries
            a location. Advisory metadata for clients that reproject; the per-record
            CRS is always the record's own `epsg`.
      required:
      - crs_easting
      - crs_elevation
      - crs_elevation_units
      - crs_epsg
      - crs_northing
      - crs_xy_units
      - date_created
      - geometry
      - geometry_geojson
      - id
      - images
      - last_edited
      - proj4_easting
      - proj4_elevation
      - proj4_elevation_units
      - proj4_northing
      - proj4_string
      - proj4_xy_units
      - project
