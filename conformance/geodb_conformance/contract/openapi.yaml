          type: string
        description: 'Incremental sync: only rows with last_edited >= the DATE part
          of this ISO 8601 date/datetime. DAY-granular — rows already modified on
          the same day are re-included; treat pulls as idempotent upserts keyed on
          id. The same-day over-inclusion is deliberate: under-including would silently
          lose an edit made after your previous pull on that day. Deletions are not
          reflected here; keep using deleted_since / deleted_ids. A value that cannot
          be parsed is REFUSED with 400 reason_code=invalid_parameter. When sent,
          the response echoes modified_since_applied.'
      - in: query
        name: deleted_since
        schema:
          type: string
        description: 'Deletion sync: restrict deleted_ids to records soft-deleted
          on or after the DATE part of this ISO 8601 date/datetime. DAY-granular and
          inclusive, for the same reason as modified_since — removal is idempotent,
          so over-including a deletion is harmless and under-including leaves a ghost
          record. Omit it on a first sync to receive every deleted id. The response
          echoes deleted_since_applied, and sync_timestamp is the value to send next
          time.'
      - in: query
        name: compact
        schema:
          type: string
        description: 'compact=1: lean sync serialization — flat scalars with FK ids
          (project_id, bhid_id, ...), raw extra_data dict, no nested natural keys
          / derived fields / geometry columns. Same pagination envelope and deleted_ids
          metadata. Assays inline their element values as flat dicts. Any other value
