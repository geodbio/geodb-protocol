paths:
  /api/v2/alterations/:
    get:
      operationId: alterations_list
      description: |-
        The alteration vocabulary a project logs against.

        Paged. Pass `modified_since` to fetch only what changed, and read `deleted_ids` to learn what was removed — that feed is how deletions reach you, since deleted rows simply stop appearing.

        ⚠️ `modified_since` is DAY-granular: it returns everything changed on that day or later, so a repeated pull re-sends the current day's rows. Deduplicate by `id` rather than assuming a strict watermark.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Surface Geology
      security:
      - knoxApiToken: []
      - GrantAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlterationReadList'
          description: ''
        '400':
          description: The request could not be understood (see `reason_code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'No usable credential. `reason_code` distinguishes a revoked
            grant from an expired, unknown or malformed one; the response carries
            `WWW-Authenticate: Grant`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The credential is valid but not permitted this operation —
            outside the grant surface, a write with a read-only grant, or outside
            a room-pinned grant's room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such resource inside this credential's scope. A row in another
            project is indistinguishable from one that does not exist, by design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The grant's request rate was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Sent on every throttled
                response.
              schema:
                type: integer
