          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,6})?$
          nullable: true
          description: 'Lower detection limit for the method that produced this value,
            in the same units. A value at or below it is reported with `above_det_limit:
            false`.'
        units:
          type: string
          maxLength: 16
          description: Units for this value (e.g. `ppm`, `ppb`, `pct`, `g/t`, `oz/ton`).
            Per value — always read it beside the value rather than assuming a project-wide
            unit.
