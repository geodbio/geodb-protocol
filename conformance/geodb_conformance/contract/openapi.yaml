          / derived fields / geometry columns. Same pagination envelope and deleted_ids
          metadata. Assays inline their element values as flat dicts. Any other value
          = default rich shape.'
      - in: query
        name: skip_count
        schema:
          type: string
        description: 'skip_count=1: suppress the per-page COUNT(*). count is null;
          next is present exactly while a full page was returned.'
