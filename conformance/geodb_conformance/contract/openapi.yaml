          format: double
          nullable: true
          description: Get project CRS elevation (Z coordinate).
          readOnly: true
        crs_epsg:
          type: integer
          nullable: true
          description: Get project EPSG code.
          readOnly: true
        crs_xy_units:
          type: string
          nullable: true
          description: Get project CRS XY units (degrees, meters, feet, us-feet).
          readOnly: true
        crs_elevation_units:
          type: string
          nullable: true
          description: Get project CRS elevation units (M or FT).
          readOnly: true
        proj4_easting:
          type: number
          format: double
          nullable: true
          description: Get local grid easting (X coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_northing:
          type: number
          format: double
          nullable: true
          description: Get local grid northing (Y coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_elevation:
          type: number
          format: double
          nullable: true
          description: Get local grid elevation (Z coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_string:
          type: string
          nullable: true
          description: Get project's Proj4 definition string.
          readOnly: true
        proj4_xy_units:
          type: string
          nullable: true
          description: Get Proj4 local grid XY units (usually 'meters').
          readOnly: true
        proj4_elevation_units:
          type: string
          nullable: true
          description: Get Proj4 local grid elevation units (M or FT).
          readOnly: true
        notes:
          type: string
          nullable: true
        geometry:
          type: string
          readOnly: true
          nullable: true
          description: |-
            The derived WGS84 location as an EWKT string: `SRID=4326;POINT Z (lon lat elev)` — longitude first, then latitude, then elevation in metres (`POINT` without `Z` when no elevation is recorded). Always EPSG 4326, whatever `epsg` says.

            This is the reprojected value. The original coordinate the customer supplied is `source_coordinate`. For a parsed object rather than a string, read `geometry_geojson`.
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Attached records, each as an object carrying its id, its natural
            key and display metadata. Soft-deleted attachments are omitted.
          readOnly: true
        images:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Attached records, each as an object carrying its id, its natural
            key and display metadata. Soft-deleted attachments are omitted.
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        source_coordinate:
