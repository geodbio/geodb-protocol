          type: integer
          nullable: true
        alteration:
          type: integer
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        longitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        epsg:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: EPSG code of the coordinate reference system that `latitude`,
            `longitude` and `source_coordinate` are expressed in — the CRS the data
            was imported in, preserved rather than normalised. Interpret those values
            against this code; they are degrees only when it is 4326. The derived
            WGS84 form is always in `geometry` / `geometry_geojson`.
        elevation:
          type: number
          format: double
          nullable: true
          description: Elevation of the collar, in `elevation_units`. See `elevation_source`
            for whether it was surveyed, taken from a DEM, or entered by hand.
        length_units:
          $ref: '#/components/schemas/LengthUnitsEnum'
          description: 'Units the record''s DEPTH and LENGTH values are stored in:
            `M` (metres) or `FT` (feet). Stored units, not a display preference —
            read every depth against this.'
        xy_units:
          type: string
          nullable: true
          description: Get XY units for original coordinates (degrees, meters, feet,
            us-feet).
          readOnly: true
        crs_easting:
          type: number
          format: double
          nullable: true
          description: Get project CRS easting (X coordinate).
          readOnly: true
        crs_northing:
          type: number
          format: double
          nullable: true
          description: Get project CRS northing (Y coordinate).
          readOnly: true
        crs_elevation:
          type: number
          format: double
          nullable: true
          description: Get project CRS elevation (Z coordinate).
          readOnly: true
        crs_epsg:
          type: integer
          nullable: true
          description: Get project EPSG code.
