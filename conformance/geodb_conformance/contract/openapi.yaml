    get:
      operationId: point_samples_list
      description: |-
        A sample collected at a location on surface rather than down a hole — soil, rock chip, stream sediment.

        ⚠️ `latitude` / `longitude` are the ORIGINAL imported coordinate in the CRS named by `epsg`, not necessarily degrees. Read `geometry` for WGS84.

        A sample may also carry a PLANNED location (`target_*`) alongside where it was actually collected.

        Paged. Pass `modified_since` to fetch only what changed, and read `deleted_ids` to learn what was removed — that feed is how deletions reach you, since deleted rows simply stop appearing.

