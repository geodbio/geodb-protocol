    PointSampleRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
          description: Lab sample bag ID. Set when sample is physically collected.
          maxLength: 150
        sequence_number:
          type: string
          nullable: true
          description: Planning reference ID (e.g., SS-001). Used for navigation and
            display.
          maxLength: 50
        status:
          $ref: '#/components/schemas/PointSampleReadStatusEnum'
        status_notes:
          type: string
          nullable: true
          description: Reason for skipping, access issues, etc.
        lab_status:
          nullable: true
          description: |-
            Lab workflow status (Planned, Collected, Submitted, Analyzed) — separate from the field-collection status.

            * `PL` - Planned
            * `CO` - Collected
            * `SU` - Submitted
            * `AN` - Analyzed
          oneOf:
          - $ref: '#/components/schemas/LabStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        display_name:
          type: string
          readOnly: true
          nullable: true
        project:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Natural key of the project: `{"name", "company"}`.'
          readOnly: true
        sample_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PointSampleReadSampleTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        ps_type:
          type: integer
          nullable: true
        lithology:
          type: integer
          nullable: true
        alteration:
          type: integer
          nullable: true
        assay:
          type: string
          readOnly: true
          nullable: true
        target_latitude:
          type: number
          format: double
          nullable: true
          description: Planned collection latitude (WGS84)
        target_longitude:
          type: number
          format: double
          nullable: true
          description: Planned collection longitude (WGS84)
        target_elevation:
          type: number
          format: double
          nullable: true
          description: Planned collection elevation
        target_epsg:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: EPSG code of original target coordinates
        latitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        longitude:
          type: number
          format: double
          nullable: true
          description: |-
            ⚠️ NOT necessarily degrees. This is the ORIGINAL as-imported coordinate in the CRS named by `epsg`: for a projected CRS (UTM, State Plane, ...) `longitude` holds the EASTING and `latitude` holds the NORTHING. The values are true WGS84 degrees only when `epsg` is 4326.

            The field names are historical and are kept for continuity. For an unambiguous form of the same values, read `source_coordinate`; for WGS84, read `geometry` (EWKT) or `geometry_geojson`.
        epsg:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
          description: EPSG code of the coordinate reference system that `latitude`,
            `longitude` and `source_coordinate` are expressed in — the CRS the data
            was imported in, preserved rather than normalised. Interpret those values
            against this code; they are degrees only when it is 4326. The derived
            WGS84 form is always in `geometry` / `geometry_geojson`.
        elevation:
          type: number
          format: double
          nullable: true
          description: Elevation of the collar, in `elevation_units`. See `elevation_source`
            for whether it was surveyed, taken from a DEM, or entered by hand.
        length_units:
          $ref: '#/components/schemas/LengthUnitsEnum'
          description: 'Units the record''s DEPTH and LENGTH values are stored in:
            `M` (metres) or `FT` (feet). Stored units, not a display preference —
            read every depth against this.'
        xy_units:
          type: string
          nullable: true
          description: Get XY units for original coordinates (degrees, meters, feet,
            us-feet).
          readOnly: true
        crs_easting:
          type: number
          format: double
          nullable: true
          description: Get project CRS easting (X coordinate).
          readOnly: true
        crs_northing:
          type: number
          format: double
          nullable: true
          description: Get project CRS northing (Y coordinate).
          readOnly: true
        crs_elevation:
          type: number
          format: double
          nullable: true
          description: Get project CRS elevation (Z coordinate).
          readOnly: true
        crs_epsg:
          type: integer
          nullable: true
          description: Get project EPSG code.
          readOnly: true
        crs_xy_units:
          type: string
          nullable: true
          description: Get project CRS XY units (degrees, meters, feet, us-feet).
          readOnly: true
        crs_elevation_units:
          type: string
          nullable: true
          description: Get project CRS elevation units (M or FT).
          readOnly: true
        proj4_easting:
          type: number
          format: double
          nullable: true
          description: Get local grid easting (X coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_northing:
          type: number
          format: double
          nullable: true
          description: Get local grid northing (Y coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_elevation:
          type: number
          format: double
          nullable: true
          description: Get local grid elevation (Z coordinate in custom Proj4 CRS).
          readOnly: true
        proj4_string:
          type: string
          nullable: true
          description: Get project's Proj4 definition string.
          readOnly: true
        proj4_xy_units:
          type: string
          nullable: true
          description: Get Proj4 local grid XY units (usually 'meters').
          readOnly: true
        proj4_elevation_units:
          type: string
          nullable: true
          description: Get Proj4 local grid elevation units (M or FT).
          readOnly: true
        distance_from_target_meters:
          type: number
          format: double
          readOnly: true
          nullable: true
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
          nullable: true
        assigned_by:
          allOf:
          - $ref: '#/components/schemas/UserMinimal'
          readOnly: true
          nullable: true
        assigned_date:
          type: string
          format: date-time
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
          description: Target date for collection
        submittal:
          type: integer
          readOnly: true
          nullable: true
        submittal_name:
          type: string
          readOnly: true
          nullable: true
        package_number:
          type: string
          readOnly: true
          nullable: true
        sample_package:
          type: integer
          readOnly: true
          nullable: true
        sample_package_detail:
          type: string
          readOnly: true
          nullable: true
        date_collected:
          type: string
          format: date
          nullable: true
        collected_by:
          type: string
          nullable: true
          maxLength: 50
        notes:
          type: string
          nullable: true
        geometry:
          type: string
          readOnly: true
          nullable: true
          description: |-
            The derived WGS84 location as an EWKT string: `SRID=4326;POINT Z (lon lat elev)` — longitude first, then latitude, then elevation in metres (`POINT` without `Z` when no elevation is recorded). Always EPSG 4326, whatever `epsg` says.

            This is the reprojected value. The original coordinate the customer supplied is `source_coordinate`. For a parsed object rather than a string, read `geometry_geojson`.
        images:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Attached records, each as an object carrying its id, its natural
            key and display metadata. Soft-deleted attachments are omitted.
          readOnly: true
        date_created:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_edited:
          type: string
          format: date
          readOnly: true
          nullable: true
        source_coordinate:
          allOf:
          - $ref: '#/components/schemas/SourceCoordinate'
          nullable: true
          readOnly: true
        geometry_geojson:
          allOf:
          - $ref: '#/components/schemas/GeoJSONPoint'
          nullable: true
          readOnly: true
        coordinate_system_metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: The project's coordinate-system settings (declared EPSG, optional
            local-grid proj4 string, units). Present on every record whose model carries
            a location. Advisory metadata for clients that reproject; the per-record
            CRS is always the record's own `epsg`.
        metal_equivalent_config:
          type: string
          nullable: true
          description: Name of the price deck behind the metal-equivalent column.
            The number never travels without its deck.
        metal_equivalent_target:
          type: string
          nullable: true
          description: Target element of the metal-equivalent calculation.
        metal_equivalent_blank_reason:
          type: string
          nullable: true
          description: Machine-readable reason a metal-equivalent value is blank,
            when it is.
      required:
      - assay
      - assigned_by
      - assigned_to
      - crs_easting
      - crs_elevation
      - crs_elevation_units
      - crs_epsg
      - crs_northing
      - crs_xy_units
      - date_created
      - display_name
      - distance_from_target_meters
      - geometry
      - geometry_geojson
      - id
      - images
      - last_edited
      - package_number
      - proj4_easting
      - proj4_elevation
      - proj4_elevation_units
      - proj4_northing
      - proj4_string
      - proj4_xy_units
      - project
      - sample_package
      - sample_package_detail
      - source_coordinate
      - submittal
      - submittal_name
      - xy_units
      patternProperties:
        ^cf_[a-z0-9_]+$:
          description: 'Custom field. Any number of `cf_*` keys may be present: they
            are the project''s user-defined fields, flattened to top level. The set
            of keys and their types vary BY PROJECT and BY MODEL — discover them at
            `/api/v2/model-schemas/?project_id=<id>`, never by assuming a fixed set.
            Values are whatever the customer stored (string, number, boolean or null).
            Calculated custom fields appear under the same prefix and are read-only.'
        ^[A-Z][a-z]?Eq(\s.+)?$:
          description: Metal-equivalent value (e.g. `AuEq ppm`), present only when
            the project has a price deck. The key names the target element and its
            units; the accompanying `metal_equivalent_*` keys name the deck behind
            it.
      additionalProperties: false
