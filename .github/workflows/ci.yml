name: CI

# Everything here runs on a bare checkout of this repository. It deliberately
# does NOT run scripts/regenerate.py --check in full: regenerating
# spec/openapi.yaml and stac/xpl/schema.json needs a geoDB checkout and a
# configured Django project. That half of the drift check runs in our own CI,
# where the implementation is available.
#
# ⭐ The half that CAN run here does: scripts/validate.py re-derives schemas/
# and PROFILE.md from the COMMITTED spec and fails if either has drifted from
# it (ruling R4). So the guarantee "no file in this repo contradicts the
# normative document" is enforced on every push, by GitHub, with no
# credentials — which is the guarantee the audit found broken.
#
# Several steps are guarded with `if [ -f ... ]` / `if [ -d ... ]` on purpose.
# The examples tree, the id checker and the conformance suite land in later
# tasks; the workflow is green today and picks each one up the moment it exists,
# without a second edit to this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas, spec, and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate protocol artifacts
        run: python scripts/validate.py

      - name: Check the generated AGENTS.md tables
        run: |
          if [ -f scripts/emit_agents.py ]; then
            python scripts/emit_agents.py --check
          else
            echo "scripts/emit_agents.py not present yet; skipping."
          fi

      - name: Check schema and extension $id hosts
        run: |
          if [ -f scripts/check_ids.py ]; then
            python scripts/check_ids.py
          else
            echo "scripts/check_ids.py not present yet; skipping."
          fi

      - name: The conformance suite carries the CURRENT contract
        run: |
          # conformance/ ships its own copy of the spec, the schemas and the
          # error register, because a runner that fetched them from the server
          # under test would pass against any self-consistent server. A copy
          # drifts, so this is the check that it has not.
          if [ -f scripts/sync_conformance_contract.py ]; then
            python scripts/sync_conformance_contract.py --check
          else
            echo "scripts/sync_conformance_contract.py not present yet; skipping."
          fi

  examples:
    name: Run the documented examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run examples
        run: |
          if [ ! -d examples ]; then
            echo "examples/ not present yet; skipping."
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f examples/requirements.txt ]; then
            pip install -r examples/requirements.txt
          fi
          if [ -f examples/run_all.py ]; then
            python examples/run_all.py
          else
            echo "examples/ present but no run_all.py; nothing to run."
          fi

  conformance:
    name: Conformance suite (offline assertions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run the conformance suite
        run: |
          if [ ! -d conformance ]; then
            echo "conformance/ not present yet; skipping."
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f conformance/pyproject.toml ]; then
            pip install -e './conformance[geo]'
          elif [ -f conformance/requirements.txt ]; then
            pip install -r conformance/requirements.txt
          fi
          if [ -f conformance/run.py ]; then
            # No credentials in GitHub CI, and none needed: --offline runs the
            # BREAK MATRIX — every assertion against a mock server broken in
            # exactly the one way that assertion exists to catch, asserting it
            # goes red there and green against a correct one. That is a
            # stronger check than it sounds: it fails if an assertion stops
            # detecting its own defect, which is the way a suite rots.
            # The run against a real endpoint is the credentialed job below.
            python conformance/run.py --offline
          else
            echo "conformance/ present but no run.py; nothing to run."
          fi

      - name: The AGENTS.md quickstart still compiles
        run: |
          # agent_smoke.py extracts the quickstart OUT of AGENTS.md and runs it,
          # so a quickstart that has rotted fails here rather than in the first
          # five minutes of somebody's integration. --offline parses and
          # compiles without credentials; the EXECUTING run needs a token and
          # so happens in our own CI, not here.
          if [ -f conformance/agent_smoke.py ]; then
            python conformance/agent_smoke.py --offline
          else
            echo "conformance/agent_smoke.py not present yet; skipping."
          fi

# ---------------------------------------------------------------------------
# The CREDENTIALED run, against a real endpoint.
#
# Commented out deliberately. This is a public repository: a fork's pull
# request must never be able to reach a job holding a grant token, and a
# contributor's PR must not go red because OUR sandbox happened to be down.
# The offline break matrix above is the check that belongs in public CI.
#
# We enable this in our own CI (or here, once the public sandbox grant has been
# rotated to a token whose only power is reading one CC0 demonstration project
# and whose leak costs nothing). Enable by uncommenting and setting the
# GEODB_SANDBOX_TOKEN secret.
